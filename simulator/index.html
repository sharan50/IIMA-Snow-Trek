      const i0 = b1 + c, i1 = b1 + c + 1, i2 = b0 + c + 1, i3 = b0 + c;
      if (!gok[i0] || !gok[i1] || !gok[i2] || !gok[i3]) continue;
      const x0 = gxA[i0], x1 = gxA[i1], x2 = gxA[i2], x3 = gxA[i3];
      const minx = Math.min(x0, x1, x2, x3), maxx = Math.max(x0, x1, x2, x3);
      if (maxx < -8 || minx > W + 8) continue;
      const y0 = gyA[i0], y1 = gyA[i1], y2 = gyA[i2], y3 = gyA[i3];
      const miny = Math.min(y0, y1, y2, y3), maxy = Math.max(y0, y1, y2, y3);
      if (maxy < -8 || miny > H + 8) continue;

      const sh = (gsh[i0] + gsh[i1] + gsh[i2] + gsh[i3]) * 0.25;
      const rr = SNOW_SHADE[0] + (SNOW_LIT[0] - SNOW_SHADE[0]) * sh;
      const gg = SNOW_SHADE[1] + (SNOW_LIT[1] - SNOW_SHADE[1]) * sh;
      const bb = SNOW_SHADE[2] + (SNOW_LIT[2] - SNOW_SHADE[2]) * sh;
      ctx.fillStyle = fogMix(rr | 0, gg | 0, bb | 0, fog);
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
      ctx.closePath(); ctx.fill();
      // hairline AA seams between adjacent polys show badly on flat snow —
      // only worth paying for on the near rows where they're visible
      if (seam) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1; ctx.stroke(); }
    }

    // groomer corduroy sitting on the snow we just painted
    while (cordK >= 0 && CORD_D[cordK] >= dNear) drawCorduroy(cordK--);

    // tracks carved into this band
    drawTracks(rowDepth((r + 1) / ROWS), dNear, fog);

    // objects & particles that live in this depth band
    while (rp < rl.length && rl[rp].cd > dNear) drawItem(rl[rp++]);
  }
  // anything left in front of the nearest row
  while (rp < rl.length) drawItem(rl[rp++]);
}

/* --- carve tracks --- */
const TRACKS = [];
let lastTrackZ = -1e9;
function pushTrack() {
  if (S.z - lastTrackZ < 0.55 || S.air || !S.alive) return;
  lastTrackZ = S.z;
  const c = Math.cos(S.yaw), s = Math.sin(S.yaw);
  TRACKS.push({
    z:S.z, x:S.x, y:S.y, c, s, off:0.20,
    w:0.075 + S.skid * 0.40, a:clamp(0.22 + Math.abs(S.edge) * 0.40 + S.skid * 0.34, 0, 0.7), age:0,
  });
  if (TRACKS.length > 220) TRACKS.shift();
}
function drawTracks(dFar, dNear, fog) {
  if (fog > 0.9 || dNear > 70) return;
  for (let i = 0; i < visTracks.length; i++) {
    const t = visTracks[i];
    if (t.cd <= dNear || t.cd > dFar) continue;
    const prev = t.prev;
    if (t.z - prev.z > 4) continue;                       // don't bridge a jump
    const fade = t.a * (1 - fog) * clamp(1 - t.age / 11, 0, 1);
    if (fade <= 0.015) continue;
    const nxa = -prev.c * t.w, nza = prev.s * t.w;
    for (let side = -1; side <= 1; side += 2) {
      const ax = prev.x + prev.c * side * prev.off, az = prev.z - prev.s * side * prev.off;
      const bx = t.x + t.c * side * t.off,          bz = t.z - t.s * side * t.off;
      const ay = prev.y + 0.05, by = t.y + 0.05;
      const p1 = project(ax - nxa, ay, az + nza); if (!p1.ok) continue;
      const ax1 = p1.x, ay1 = p1.y;
      const p2 = project(ax + nxa, ay, az - nza); if (!p2.ok) continue;
      const ax2 = p2.x, ay2 = p2.y;
      const p3 = project(bx + nxa, by, bz - nza); if (!p3.ok) continue;
      const ax3 = p3.x, ay3 = p3.y;
      const p4 = project(bx - nxa, by, bz + nza); if (!p4.ok) continue;
      ctx.fillStyle = 'rgba(112,146,196,' + fade.toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax2, ay2); ctx.lineTo(ax3, ay3);
      ctx.lineTo(p4.x, p4.y); ctx.closePath(); ctx.fill();
    }
  }
}

/* --- render list assembly --- */
let renderList = [];
function buildRenderList() {
  renderList.length = 0;
  const c0 = Math.floor((cam.z - 120) / CHUNK), c1 = Math.floor((cam.z + FAR_Z + 40) / CHUNK);
  for (let ci = c0; ci <= c1; ci++) {
    const list = chunkAt(ci);
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      const cd = camDepth(o.x, o.z);
      if (cd < 0.6 || cd > FAR_Z + 30) continue;
      if (Math.abs((o.x - cam.x) * rgtX + (o.z - cam.z) * rgtZ) > cd * 1.5 + 40) continue;
      o.cd = cd;
      renderList.push(o);
    }
  }
  for (const p of PARTS) renderList.push({ t:100, z:p.z, cd:camDepth(p.x, p.z), p });
  if (ragdoll) for (const p of ragdoll) renderList.push({ t:101, z:p.z, cd:camDepth(p.x, p.z), p });
  else if (S.alive) renderList.push({ t:102, z:S.z, cd:camDepth(S.x, S.z) });
  for (const n of NPCS) {
    const cd = camDepth(n.x, n.z);
    if (cd > 0.6 && cd < FAR_Z + 20) renderList.push({ t:103, z:n.z, cd, n });
  }
  // only the tracks close enough to matter — saves re-scanning all of them
  // once per terrain row
  visTracks.length = 0;
  for (let i = 1; i < TRACKS.length; i++) {
    const t = TRACKS[i];
    t.cd = camDepth(t.x, t.z);
    if (t.cd > 0.5 && t.cd < 70) { t.prev = TRACKS[i - 1]; visTracks.push(t); }
  }
  renderList.sort((a, b) => b.cd - a.cd);
}
const visTracks = [];

function fogAt(d) { return clamp(Math.pow(d / FAR_Z, 1.42) * 1.18, 0, 1); }

/* a soft contact shadow so nothing looks like a sticker floating on the snow */
function contactShadow(x, y, z, rad, strength) {
  const pr = project(x + rad * 0.30, y + 0.02, z - rad * 0.12);
  if (!pr.ok) return;
  const r = rad * pr.s;
  if (r < 1.1) return;
  const a = strength * (1 - fogAt(pr.d));
  if (a < 0.02) return;
  ctx.fillStyle = 'rgba(104,134,184,' + a.toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(pr.x, pr.y, r, r * 0.30, 0, 0, TAU);
  ctx.fill();
}

function drawItem(o) {
  switch (o.t) {
    case OBJ.TREE:   drawTree(o); break;
    case OBJ.ROCK:   drawRock(o); break;
    case OBJ.POLE:   drawPole(o); break;
    case OBJ.SIGN:   drawSign(o); break;
    case OBJ.BANNER: drawBanner(o); break;
    case OBJ.TOWER:  drawTower(o); break;
    case OBJ.NET:    drawNet(o); break;
    case OBJ.GUN:    drawGun(o); break;
    case OBJ.HAY:    drawHay(o); break;
    case 100: drawParticle(o.p); break;
    case 101: drawRagPart(o.p); break;
    case 102: drawSkier(); break;
    case 103: drawNpc(o.n); break;
  }
}

function drawTree(o) {
  const pr = project(o.x, o.y, o.z); if (!pr.ok) return;
  const s = pr.s, hpx = o.h * s;
  if (hpx < 2.2 || pr.x < -60 || pr.x > W + 60) return;
  const f = fogAt(pr.d), x = pr.x, y = pr.y;
  if (pr.d < 55) contactShadow(o.x, o.y, o.z, o.h * 0.16, 0.30);
  const wpx = hpx * (o.kind === 0 ? 0.30 : 0.24);
  // trunk
  ctx.fillStyle = fogMix(58, 42, 33, f);
  ctx.fillRect(x - wpx * 0.09, y - hpx * 0.20, wpx * 0.18, hpx * 0.21);
  const tiers = o.kind === 0 ? 4 : 3;
  for (let i = 0; i < tiers; i++) {
    const t0 = 0.14 + i * (0.86 / tiers);
    const t1 = t0 + (0.86 / tiers) * 1.52;
    const w = wpx * (1 - i / tiers * 0.72);
    const g = 0.62 + i * 0.10;
    ctx.fillStyle = fogMix((26 * g) | 0, (58 * g) | 0, (40 * g) | 0, f);
    ctx.beginPath();
    ctx.moveTo(x, y - hpx * Math.min(1.02, t1));
    ctx.lineTo(x - w, y - hpx * t0); ctx.lineTo(x + w, y - hpx * t0);
    ctx.closePath(); ctx.fill();
    // snow load
    if (hpx > 12) {
      ctx.fillStyle = fogMix(232, 240, 250, f * 0.85);
      ctx.beginPath();
      ctx.moveTo(x, y - hpx * Math.min(1.02, t1));
      ctx.lineTo(x - w * 0.62, y - hpx * (t0 + (t1 - t0) * 0.34));
      ctx.lineTo(x + w * 0.34, y - hpx * (t0 + (t1 - t0) * 0.42));
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawRock(o) {
  const pr = project(o.x, o.y, o.z); if (!pr.ok) return;
  const s = pr.s, r = o.r * s;
  if (r < 1.1) return;
  const f = fogAt(pr.d), x = pr.x, y = pr.y;
  ctx.fillStyle = fogMix(74, 78, 88, f);
  ctx.beginPath();
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU;
    const rr = r * (0.62 + hashi((o.seed * 900) | 0, i) * 0.6);
    const px = x + Math.cos(a) * rr, py = y - Math.abs(Math.sin(a)) * rr * 0.9;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = fogMix(226, 236, 248, f);
  ctx.beginPath(); ctx.ellipse(x - r * 0.1, y - r * 0.72, r * 0.66, r * 0.24, -0.2, 0, TAU); ctx.fill();
}

function drawPole(o) {
  const a = project(o.x, o.y, o.z); if (!a.ok) return;
  const b = project(o.x, o.y + 1.85, o.z); if (!b.ok) return;
  if (a.x < -30 || a.x > W + 30) return;
  const f = fogAt(a.d), wpx = Math.max(0.9, 0.055 * a.s);
  const col = o.orange ? [245, 130, 32] : [30, 34, 44];
  const n = 5, dy = (a.y - b.y) / n;
  for (let i = 0; i < n; i++) {
    const c = i % 2 === 0 ? col : [242, 246, 252];
    ctx.fillStyle = fogMix(c[0], c[1], c[2], f);
    ctx.fillRect(a.x - wpx * 0.5, b.y + dy * i, wpx, dy + 0.6);
  }
}

function drawSign(o) {
  const D = o.sec.D;
  const base = project(o.x, o.y, o.z); if (!base.ok) return;
  const top = project(o.x, o.y + 2.25, o.z); if (!top.ok) return;
  const s = base.s, f = fogAt(base.d);
  if (s < 1.2) return;
  ctx.fillStyle = fogMix(120, 124, 132, f);
  ctx.fillRect(base.x - 0.05 * s, top.y, 0.10 * s, base.y - top.y);
  const w = 1.30 * s, h = 1.05 * s, x = top.x - w / 2, y = top.y - h * 0.75;
  ctx.fillStyle = fogMix(248, 250, 254, f); ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fogMix(24, 28, 36, f * 0.6); ctx.fillRect(x, y, w, h * 0.055);
  drawDiffGlyph(x + w / 2, y + h * 0.38, h * 0.32, D, f);
  if (h > 26) {
    ctx.fillStyle = fogMix(20, 24, 32, f);
    ctx.font = '900 ' + (h * 0.14).toFixed(1) + 'px Inter,system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.sec.name.toUpperCase().slice(0, 15), x + w / 2, y + h * 0.80);
    ctx.font = '800 ' + (h * 0.10).toFixed(1) + 'px Inter,system-ui,sans-serif';
    ctx.fillStyle = fogMix(90, 100, 118, f);
    ctx.fillText('N°' + o.sec.number, x + w / 2, y + h * 0.925);
  }
}

function drawDiffGlyph(cx, cy, r, D, f) {
  const c = D.col === '#000000' ? [8, 10, 14] : hex2rgb(D.col);
  ctx.fillStyle = fogMix(c[0], c[1], c[2], f);
  if (D.shape === 'circle') { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); }
  else if (D.shape === 'square') { ctx.fillRect(cx - r * 0.88, cy - r * 0.88, r * 1.76, r * 1.76); }
  else if (D.shape === 'diamond') { dia(cx, cy, r); }
  else { dia(cx - r * 0.82, cy, r * 0.86); dia(cx + r * 0.82, cy, r * 0.86); }
  function dia(x, y, rr) {
    ctx.beginPath(); ctx.moveTo(x, y - rr); ctx.lineTo(x + rr * 0.86, y);
    ctx.lineTo(x, y + rr); ctx.lineTo(x - rr * 0.86, y); ctx.closePath(); ctx.fill();
  }
}
function hex2rgb(h) {
  const v = parseInt(h.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function drawBanner(o) {
  const D = o.sec.D, w = o.w + 2.2;
  const lb = project(o.x - w, terrainH(o.x - w, o.z), o.z);
  const rb = project(o.x + w, terrainH(o.x + w, o.z), o.z);
  if (!lb.ok || !rb.ok) return;
  const hgt = 5.4;
  const lt = project(o.x - w, terrainH(o.x - w, o.z) + hgt, o.z);
  const rt = project(o.x + w, terrainH(o.x + w, o.z) + hgt, o.z);
  if (!lt.ok || !rt.ok) return;
  const f = fogAt(lb.d);
  const pw = Math.max(1.1, 0.16 * lb.s);
  ctx.fillStyle = fogMix(52, 58, 70, f);
  ctx.fillRect(lb.x - pw / 2, lt.y, pw, lb.y - lt.y);
  ctx.fillRect(rb.x - pw / 2, rt.y, pw, rb.y - rt.y);

  const bh = 1.55 * lb.s;
  const c = D.col === '#000000' ? [10, 12, 18] : hex2rgb(D.col);
  ctx.beginPath();
  ctx.moveTo(lt.x, lt.y); ctx.lineTo(rt.x, rt.y);
  ctx.lineTo(rt.x, rt.y + bh); ctx.lineTo(lt.x, lt.y + bh);
  ctx.closePath();
  ctx.fillStyle = fogMix(c[0], c[1], c[2], f * 0.85); ctx.fill();
  ctx.strokeStyle = fogMix(250, 252, 255, f * 0.7);
  ctx.lineWidth = Math.max(0.8, bh * 0.045); ctx.stroke();

  if (bh > 15) {
    const mid = (lt.x + rt.x) / 2, my = (lt.y + rt.y) / 2 + bh * 0.5;
    ctx.save();
    ctx.translate(mid, my);
    ctx.rotate(Math.atan2(rt.y - lt.y, rt.x - lt.x));
    const ink = hex2rgb(D.ink);
    ctx.fillStyle = fogMix(ink[0], ink[1], ink[2], f * 0.6);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + (bh * 0.44).toFixed(1) + 'px Inter,system-ui,sans-serif';
    ctx.fillText(o.sec.name.toUpperCase(), 0, -bh * 0.10);
    ctx.font = '800 ' + (bh * 0.20).toFixed(1) + 'px Inter,system-ui,sans-serif';
    ctx.globalAlpha = 0.82;
    ctx.fillText(D.label + '  ·  N°' + o.sec.number + '  ·  ' + o.sec.tag, 0, bh * 0.28);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawTower(o) {
  const b = project(o.x, o.y, o.z); if (!b.ok) return;
  const t = project(o.x, o.y + o.h, o.z); if (!t.ok) return;
  const f = fogAt(b.d), s = b.s;
  if (s < 0.6) return;
  const wB = 0.85 * s, wT = 0.38 * s;
  ctx.strokeStyle = fogMix(96, 104, 118, f);
  ctx.lineWidth = Math.max(0.8, 0.09 * s);
  ctx.beginPath();
  ctx.moveTo(b.x - wB, b.y); ctx.lineTo(t.x - wT, t.y);
  ctx.moveTo(b.x + wB, b.y); ctx.lineTo(t.x + wT, t.y);
  const rungs = 6;
  for (let i = 1; i <= rungs; i++) {
    const k = i / (rungs + 1);
    const y = lerp(b.y, t.y, k), ww = lerp(wB, wT, k);
    ctx.moveTo(b.x - ww, y); ctx.lineTo(b.x + ww, y);
  }
  ctx.stroke();
  // cross arm + cable to the next tower
  ctx.lineWidth = Math.max(0.8, 0.12 * s);
  ctx.beginPath(); ctx.moveTo(t.x - wT * 2.6, t.y); ctx.lineTo(t.x + wT * 2.6, t.y); ctx.stroke();
  const nz = o.z + 60, nx = liftX(nz);
  const nt = project(nx, terrainH(nx, nz) + 11.2, nz);
  if (nt.ok) {
    ctx.strokeStyle = fogMix(96, 106, 124, f);
    ctx.lineWidth = Math.max(0.6, 0.028 * s);
    ctx.beginPath();
    ctx.moveTo(t.x, t.y);
    const mz = o.z + 30, mx = liftX(mz);
    const mt = project(mx, terrainH(mx, mz) + 11.2 - 2.2, mz);
    if (mt.ok) ctx.quadraticCurveTo(mt.x, mt.y, nt.x, nt.y); else ctx.lineTo(nt.x, nt.y);
    ctx.stroke();
    // chairs
    for (let k = 0; k < 3; k++) {
      const tt = ((GAME.clock * 0.035) + k / 3) % 1;
      const cz = lerp(o.z, nz, tt), cxw = liftX(cz);
      const sag = Math.sin(tt * Math.PI) * 2.2;
      const cp = project(cxw, terrainH(cxw, cz) + 11.2 - sag, cz);
      if (!cp.ok) continue;
      const cs = cp.s;
      if (cs < 1) continue;
      ctx.strokeStyle = fogMix(48, 54, 66, f); ctx.lineWidth = Math.max(0.6, 0.05 * cs);
      ctx.beginPath(); ctx.moveTo(cp.x, cp.y); ctx.lineTo(cp.x, cp.y + 1.5 * cs); ctx.stroke();
      ctx.fillStyle = fogMix(196, 60, 52, f);
      ctx.fillRect(cp.x - 0.75 * cs, cp.y + 1.5 * cs, 1.5 * cs, 0.55 * cs);
      ctx.fillStyle = fogMix(40, 60, 96, f);
      ctx.fillRect(cp.x - 0.5 * cs, cp.y + 0.85 * cs, 1.0 * cs, 0.72 * cs);
    }
  }
}

function drawNet(o) {
  const b = project(o.x, o.y, o.z); if (!b.ok) return;
  const t = project(o.x, o.y + 1.75, o.z); if (!t.ok) return;
  const f = fogAt(b.d), s = b.s;
  if (s < 0.9) return;
  const nz = o.z + 5, nx = centerAt(nz) + o.side * (paramsAt(nz).width + 1.3);
  const nb = project(nx, terrainH(nx, nz), nz), nt2 = project(nx, terrainH(nx, nz) + 1.75, nz);
  if (nb.ok && nt2.ok && !o.end) {
    ctx.fillStyle = 'rgba(70,150,235,' + (0.30 * (1 - f)).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y);
    ctx.lineTo(nt2.x, nt2.y); ctx.lineTo(nb.x, nb.y); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = fogMix(228, 232, 240, f);
  ctx.fillRect(b.x - 0.06 * s, t.y, 0.12 * s, b.y - t.y);
}

function drawGun(o) {
  const b = project(o.x, o.y, o.z); if (!b.ok) return;
  const s = b.s, f = fogAt(b.d);
  if (s < 1.2) return;
  ctx.fillStyle = fogMix(190, 196, 206, f);
  ctx.fillRect(b.x - 0.13 * s, b.y - 3.2 * s, 0.26 * s, 3.2 * s);
  ctx.fillStyle = fogMix(56, 120, 190, f);
  ctx.beginPath(); ctx.ellipse(b.x, b.y - 3.5 * s, 0.55 * s, 0.42 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,' + (0.30 * (1 - f)).toFixed(3) + ')';
  for (let i = 0; i < 4; i++) {
    const t = (GAME.clock * 0.7 + i * 0.25 + o.seed) % 1;
    ctx.beginPath();
    ctx.arc(b.x + t * 4.2 * s, b.y - 3.6 * s + t * t * 2.4 * s, (0.3 + t * 1.7) * s, 0, TAU);
    ctx.fill();
  }
}

function drawHay(o) {
  const b = project(o.x, o.y, o.z); if (!b.ok) return;
  const s = b.s, f = fogAt(b.d);
  if (s < 1) return;
  ctx.fillStyle = fogMix(o.seed > 0.5 ? 226 : 44, o.seed > 0.5 ? 96 : 52, o.seed > 0.5 ? 60 : 66, f);
  ctx.beginPath();
  ctx.ellipse(b.x, b.y - 0.6 * s, 0.85 * s, 0.62 * s, 0, 0, TAU);
  ctx.fill();
}

function drawParticle(p) {
  const pr = project(p.x, p.y, p.z); if (!pr.ok) return;
  const r = p.r * pr.s;
  if (r < 0.35) return;
  const a = (1 - p.life / p.max) * 0.72 * (1 - fogAt(pr.d));
  if (a <= 0.01) return;
  ctx.fillStyle = 'rgba(250,253,255,' + a.toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(pr.x, pr.y, r, 0, TAU); ctx.fill();
}

/* --- skier --- */
function skiQuad(cx, cy, cz, yaw, roll, len, wid, lift) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const ux = s * len * 0.5, uz = c * len * 0.5;              // along the ski
  const vx = c * wid * 0.5, vz = -s * wid * 0.5;             // across
  const dy = Math.abs(Math.sin(roll)) * wid * 0.5;           // edge lifts off the snow
  const pts = [
    [cx - ux - vx, cy + lift + (roll > 0 ? dy : 0), cz - uz - vz],
    [cx - ux + vx, cy + lift + (roll < 0 ? dy : 0), cz - uz + vz],
    [cx + ux + vx, cy + lift + (roll < 0 ? dy : 0), cz + uz + vz],
    [cx + ux - vx, cy + lift + (roll > 0 ? dy : 0), cz + uz - vz],
  ];
  const out = [];
  for (const p of pts) { const pr = project(p[0], p[1], p[2]); if (!pr.ok) return null; out.push(pr.x, pr.y); }
  return out;
}

function drawSkier() {
  const roll = -S.edge * S.edgeAngle;
  const bootY = S.y + 0.04;

  // shadow on the snow — grows and softens as you get air
  const gh = terrainH(S.x, S.z);
  const lift = clamp((S.y - gh) / 7, 0, 1);
  contactShadow(S.x, gh, S.z, 0.78 + lift * 1.4, 0.40 * (1 - lift * 0.62));

  // skis, properly placed in 3D so the heading reads
  const c = Math.cos(S.yaw), s = Math.sin(S.yaw);
  for (let side = -1; side <= 1; side += 2) {
    const off = 0.20 + Math.abs(S.edge) * 0.05;
    const sx = S.x + c * side * off, sz = S.z - s * side * off;
    const q = skiQuad(sx, bootY, sz, S.yaw, roll, 1.78, 0.115, 0.01);
    if (!q) continue;
    ctx.fillStyle = side < 0 ? '#e11d48' : '#f59e0b';
    ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]);
    ctx.lineTo(q[4], q[5]); ctx.lineTo(q[6], q[7]); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(20,26,38,.7)'; ctx.lineWidth = Math.max(0.6, 0.6 * DPR); ctx.stroke();
  }

  const pr = project(S.x, bootY, S.z); if (!pr.ok) return;
  const m = pr.s;                       // pixels per metre at the skier
  if (m < 1) return;

  const crouch = S.crouch;
  const legL   = lerp(0.92, 0.44, crouch);
  const torsoL = lerp(0.66, 0.52, crouch);
  const lean   = lerp(0.10, 0.72, crouch) + (S.air ? 0.16 : 0);
  const inc    = roll * 0.85;           // inclination into the turn

  ctx.save();
  ctx.translate(pr.x, pr.y);
  ctx.rotate(inc);
  ctx.scale(m, -m);
  ctx.lineCap = 'round';

  const hipY = legL, shY = hipY + torsoL * Math.cos(lean), shZ = torsoL * Math.sin(lean);
  const stance = 0.21;

  // legs
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 0.115;
  ctx.beginPath();
  ctx.moveTo(-stance, 0.03); ctx.lineTo(-stance * 0.55, hipY);
  ctx.moveTo( stance, 0.03); ctx.lineTo( stance * 0.55, hipY);
  ctx.stroke();
  // boots
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-stance - 0.085, 0.0, 0.17, 0.20);
  ctx.fillRect( stance - 0.085, 0.0, 0.17, 0.20);

  // torso — a jacket with a bit of shape
  const jacket = ctx.createLinearGradient(0, hipY, 0, shY);
  jacket.addColorStop(0, '#0e7490'); jacket.addColorStop(1, '#22d3ee');
  ctx.fillStyle = jacket;
  ctx.beginPath();
  ctx.moveTo(-0.17, hipY - 0.02);
  ctx.lineTo(-0.20 - shZ * 0.10, shY);
  ctx.lineTo( 0.20 - shZ * 0.10, shY);
  ctx.lineTo( 0.17, hipY - 0.02);
  ctx.closePath(); ctx.fill();

  // arms + poles
  const armDrop = lerp(0.16, 0.30, crouch);
  const armFwd  = lerp(0.20, 0.40, crouch);
  ctx.strokeStyle = '#0e7490'; ctx.lineWidth = 0.085;
  ctx.beginPath();
  ctx.moveTo(-0.19, shY - 0.03); ctx.lineTo(-0.19 - armFwd * 0.5, shY - armDrop);
  ctx.moveTo( 0.19, shY - 0.03); ctx.lineTo( 0.19 + armFwd * 0.5, shY - armDrop);
  ctx.stroke();
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 0.035;
  ctx.beginPath();
  ctx.moveTo(-0.19 - armFwd * 0.5, shY - armDrop); ctx.lineTo(-0.42, shY - armDrop - 0.86);
  ctx.moveTo( 0.19 + armFwd * 0.5, shY - armDrop); ctx.lineTo( 0.42, shY - armDrop - 0.86);
  ctx.stroke();
  // gloves
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(-0.19 - armFwd * 0.5, shY - armDrop, 0.062, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 0.19 + armFwd * 0.5, shY - armDrop, 0.062, 0, TAU); ctx.fill();

  // helmet + goggles
  const headY = shY + 0.165;
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.arc(-shZ * 0.16, headY, 0.152, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(-shZ * 0.16, headY + 0.02, 0.152, Math.PI * 0.08, Math.PI * 0.92); ctx.fill();

  ctx.restore();

  // aero shimmer when tucked
  if (S.tuck && S.speed > 18) {
    ctx.strokeStyle = 'rgba(210,235,255,' + (0.14 + 0.14 * Math.sin(GAME.clock * 22)).toFixed(3) + ')';
    ctx.lineWidth = 1.1 * DPR;
    for (let i = -1; i <= 1; i += 2) {
      ctx.beginPath();
      ctx.moveTo(pr.x + i * 0.55 * m, pr.y - 1.0 * m);
      ctx.lineTo(pr.x + i * 1.35 * m, pr.y - 2.2 * m);
      ctx.stroke();
    }
  }
}

/* --- other skiers --- */
function drawNpc(n) {
  const pr = project(n.x, n.y + 0.02, n.z); if (!pr.ok) return;
  // project() reuses one shared result object and the shadow/ski calls below
  // clobber it — keep the base anchor in locals
  const bx = pr.x, by = pr.y, m = pr.s, d = pr.d, f = fogAt(pr.d);
  if (bx < -80 || bx > W + 80 || f > 0.96) return;

  // far away they're just a fleck of jacket colour moving on the snow
  if (m < 2.2) {
    if (m < 0.5) return;
    ctx.fillStyle = fogMix(n.c1[0], n.c1[1], n.c1[2], f);
    if (n.downed) ctx.fillRect(bx - 0.5 * m, by - 0.3 * m, m, 0.3 * m);
    else ctx.fillRect(bx - 0.24 * m, by - 1.45 * m, 0.48 * m, 1.45 * m);
    return;
  }
  if (d < 55) contactShadow(n.x, terrainH(n.x, n.z), n.z, n.downed ? 1.1 : 0.72, 0.30);

  const c = Math.cos(n.yaw), s = Math.sin(n.yaw);

  if (n.downed) {
    // a private yard sale: skis flung, body sprawled in the snow
    ctx.fillStyle = fogMix(n.skiC[0], n.skiC[1], n.skiC[2], f);
    const q1 = skiQuad(n.x - c * 0.7, n.y + 0.02, n.z + s * 0.7, n.yaw + 1.05, 0, 1.66, 0.10, 0.01);
    const q2 = skiQuad(n.x + c * 0.8, n.y + 0.02, n.z - s * 0.5, n.yaw - 1.4, 0, 1.66, 0.10, 0.01);
    for (const q of [q1, q2]) {
      if (!q) continue;
      ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]);
      ctx.lineTo(q[4], q[5]); ctx.lineTo(q[6], q[7]); ctx.closePath(); ctx.fill();
    }
    ctx.save();
    ctx.translate(bx, by); ctx.scale(m, -m);
    ctx.fillStyle = fogMix(n.c1[0], n.c1[1], n.c1[2], f);
    ctx.beginPath(); ctx.ellipse(0, 0.17, 0.46, 0.155, n.sprA * 0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = fogMix(n.helm[0], n.helm[1], n.helm[2], f);
    ctx.beginPath(); ctx.arc(0.40, 0.24, 0.13, 0, TAU); ctx.fill();
    // a hand goes up just before they climb back onto their feet
    if (n.downT > n.getUp - 1.3) {
      ctx.strokeStyle = fogMix(n.c2[0], n.c2[1], n.c2[2], f);
      ctx.lineWidth = 0.085; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-0.10, 0.28); ctx.lineTo(-0.20, 0.85); ctx.stroke();
    }
    ctx.restore();
    return;
  }

  // skis
  ctx.fillStyle = fogMix(n.skiC[0], n.skiC[1], n.skiC[2], f);
  for (let side = -1; side <= 1; side += 2) {
    const q = skiQuad(n.x + c * side * 0.19, n.y + 0.03, n.z - s * side * 0.19,
                      n.yaw, -n.lean * 0.8, 1.66, 0.10, 0.01);
    if (!q) continue;
    ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]);
    ctx.lineTo(q[4], q[5]); ctx.lineTo(q[6], q[7]); ctx.closePath(); ctx.fill();
  }

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(-n.lean * 0.5);
  ctx.scale(m, -m);
  ctx.lineCap = 'round';

  const hipY = n.stanceH, shY = hipY + 0.56, shZ = 0.17;
  const st = 0.20;
  // legs
  ctx.strokeStyle = fogMix(n.c2[0], n.c2[1], n.c2[2], f);
  ctx.lineWidth = 0.11;
  ctx.beginPath();
  ctx.moveTo(-st, 0.03); ctx.lineTo(-st * 0.55, hipY);
  ctx.moveTo( st, 0.03); ctx.lineTo( st * 0.55, hipY);
  ctx.stroke();
  // jacket
  ctx.fillStyle = fogMix(n.c1[0], n.c1[1], n.c1[2], f);
  ctx.beginPath();
  ctx.moveTo(-0.165, hipY - 0.02);
  ctx.lineTo(-0.195 - shZ * 0.1, shY);
  ctx.lineTo( 0.195 - shZ * 0.1, shY);
  ctx.lineTo( 0.165, hipY - 0.02);
  ctx.closePath(); ctx.fill();
  // arms
  ctx.strokeStyle = ctx.fillStyle;
  ctx.lineWidth = 0.08;
  ctx.beginPath();
  ctx.moveTo(-0.18, shY - 0.04); ctx.lineTo(-0.30, shY - 0.27);
  ctx.moveTo( 0.18, shY - 0.04); ctx.lineTo( 0.30, shY - 0.27);
  ctx.stroke();
  // poles
  ctx.strokeStyle = fogMix(148, 160, 178, f);
  ctx.lineWidth = 0.032;
  ctx.beginPath();
  ctx.moveTo(-0.30, shY - 0.27); ctx.lineTo(-0.41, shY - 1.02);
  ctx.moveTo( 0.30, shY - 0.27); ctx.lineTo( 0.41, shY - 1.02);
  ctx.stroke();
  // helmet + goggles
  ctx.fillStyle = fogMix(n.helm[0], n.helm[1], n.helm[2], f);
  ctx.beginPath(); ctx.arc(-shZ * 0.15, shY + 0.15, 0.142, 0, TAU); ctx.fill();
  ctx.fillStyle = fogMix(18, 24, 34, f);
  ctx.beginPath(); ctx.arc(-shZ * 0.15, shY + 0.165, 0.142, Math.PI * 0.10, Math.PI * 0.90); ctx.fill();
  ctx.restore();
}

function drawRagPart(p) {
  const pr = project(p.x, p.y, p.z); if (!pr.ok) return;
  const m = pr.s;
  if (m < 0.6) return;
  ctx.save();
  ctx.translate(pr.x, pr.y);
  ctx.rotate(p.roll);
  ctx.scale(m, -m);
  if (p.type === 'ski') {
    ctx.fillStyle = '#e11d48';
    ctx.fillRect(-0.89, -0.06, 1.78, 0.12);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(-0.1, -0.07, 0.2, 0.14);
  } else if (p.type === 'pole') {
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 0.035;
    ctx.beginPath(); ctx.moveTo(-0.6, 0); ctx.lineTo(0.6, 0); ctx.stroke();
    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(0.5, 0, 0.07, 0, TAU); ctx.fill();
  } else if (p.type === 'hat') {
    ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(0, 0, 0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, 0.02, 0.15, 0.1, Math.PI * 0.9); ctx.fill();
  } else {
    const g = ctx.createLinearGradient(0, -0.35, 0, 0.35);
    g.addColorStop(0, '#22d3ee'); g.addColorStop(1, '#0e7490');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 0.24, 0.42, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 0.10;
    ctx.beginPath();
    ctx.moveTo(-0.12, 0.32); ctx.lineTo(-0.30, 0.78);
    ctx.moveTo( 0.12, 0.32); ctx.lineTo( 0.34, 0.74);
    ctx.stroke();
  }
  ctx.restore();
}

/* --- weather + post --- */
function drawSnowfall(dt) {
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  for (const f of SNOW) {
    f.x += (f.vx - S.vx * 0.12) * dt;
    f.y += f.vy * dt;
    f.z -= (S.vz * 0.55) * dt;
    if (f.z < 1.5) { f.z += 128; f.x = cam.x + rnd(-45, 45) - cam.x; }
    if (f.y < -4) { f.y = 34; }
    const pr = project(cam.x + f.x, cam.y + f.y, cam.z + f.z);
    if (!pr.ok) continue;
    const r = f.r * pr.s;
    if (r < 0.35 || pr.x < 0 || pr.x > W || pr.y < 0 || pr.y > H) continue;
    ctx.globalAlpha = clamp(1 - f.z / 130, 0, 1) * 0.85;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.min(r, 4 * DPR), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPost() {
  const spdN = clamp((S.speed - 14) / 26, 0, 1);
  if (spdN > 0.01) {
    // speed streaks
    ctx.strokeStyle = 'rgba(255,255,255,' + (spdN * 0.16).toFixed(3) + ')';
    ctx.lineWidth = 1.2 * DPR;
    const t = GAME.clock * 9;
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * TAU + t * 0.13;
      const r0 = W * (0.30 + 0.12 * hashi(i, 3));
      const r1 = r0 + W * 0.10 * spdN;
      ctx.beginPath();
      ctx.moveTo(cxp + Math.cos(a) * r0, cyp + Math.sin(a) * r0 * 0.72);
      ctx.lineTo(cxp + Math.cos(a) * r1, cyp + Math.sin(a) * r1 * 0.72);
      ctx.stroke();
    }
    const vg = ctx.createRadialGradient(cxp, cyp, W * 0.24, cxp, cyp, W * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(6,14,30,' + (0.22 + spdN * 0.36).toFixed(3) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (S.risk > 0.55 && S.alive) {
    const a = (S.risk - 0.55) / 0.45;
    const rg = ctx.createRadialGradient(cxp, cyp, W * 0.18, cxp, cyp, W * 0.60);
    rg.addColorStop(0, 'rgba(0,0,0,0)');
    rg.addColorStop(1, 'rgba(220,38,38,' + (a * 0.34 * (0.65 + 0.35 * Math.sin(GAME.clock * 18))).toFixed(3) + ')');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  if (S.offPiste > 0.35 && S.alive) {
    ctx.fillStyle = 'rgba(250,204,21,' + (S.offPiste * 0.055).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ================================================================= HUD ==== */
const $ = id => document.getElementById(id);
const HUD = {
  el: {}, lastSec: null, toastT: 0, airT: 0, stripSecs: [],
  init() {
    for (const id of ['hud','runName','diffPill','diffTxt','diffGlyph','pitchRead','distVal','dropVal',
      'spdVal','spdSub','gforceF','kQ','kW','kE','stanceTxt','edgeDeg','edgeL','edgeR','stabF','stabTxt',
      'toast','toastDiff','toastName','toastSub','airTime','warn','strip','stripMe','fps'])
      this.el[id] = $(id);
  },
  airPop(t) { this.airT = 1.5; this.el.airTime.textContent = 'AIR ' + t.toFixed(1) + 's'; },
  toast(sec) {
    const D = sec.D;
    this.el.toastDiff.textContent = D.label;
    this.el.toastDiff.style.background = D.col;
    this.el.toastDiff.style.color = D.ink;
    this.el.toastName.textContent = sec.name;
    this.el.toastSub.textContent = 'N°' + sec.number + '  ·  ' + sec.tag + '  ·  ' + Math.round(sec.slope / DEG) + '° PITCH';
    this.toastT = 3.0;
  },
  buildStrip() {
    const el = this.el.strip;
    while (el.children.length > 1) el.removeChild(el.lastChild);
    const cur = sectionIndexAt(S.z);
    const segs = [];
    for (let i = cur; i < Math.min(COURSE.sections.length, cur + 7); i++) segs.push(COURSE.sections[i]);
    for (const s of segs) {
      const d = document.createElement('div');
      d.className = 'seg';
      d.style.flex = String(s.endZ - s.startZ);
      // pure black reads as a hole in the strip; lift it just enough to see
      d.style.background = ['#22c55e', '#3b82f6', '#ef4444', '#334155', '#0b0f18'][s.diff];
      el.appendChild(d);
    }
    this.stripSecs = segs;
  },
  update(dt) {
    const e = this.el;
    const p = paramsAt(S.z), sec = p.sec, D = sec.D;
    if (sec !== this.lastSec) {
      this.lastSec = sec;
      e.runName.textContent = sec.name;
      e.diffTxt.textContent = D.label;
      e.diffPill.style.background = D.col;
      e.diffPill.style.color = D.ink;
      e.diffGlyph.style.color = D.ink;
      e.diffGlyph.style.borderRadius = D.shape === 'circle' ? '50%' : '0';
      e.diffGlyph.style.transform = (D.shape === 'diamond' || D.shape === 'double') ? 'rotate(45deg) scale(.82)' : 'none';
      this.toast(sec);
      this.buildStrip();
      AU.setDifficulty(sec.diff);
      AU.chime(sec.diff);
    }
    e.pitchRead.textContent = Math.round(p.slope / DEG) + '° pitch · ' + Math.round(p.width * 2) + ' m wide'
      + (p.mogul > 0.25 ? ' · moguls' : '');

    e.distVal.innerHTML = Math.round(S.dist).toLocaleString() + '<small style="font-size:13px;color:#7f97bb"> m</small>';
    e.dropVal.textContent = '▼ ' + Math.round(S.drop).toLocaleString() + ' m vertical';

    const kmh = S.speed * 3.6;
    e.spdVal.innerHTML = Math.round(kmh) + '<small>KM/H</small>';
    e.spdSub.textContent = 'max ' + Math.round(S.maxSpeed * 3.6) + ' · avg ' + Math.round(S.time > 0.5 ? (S.dist / S.time) * 3.6 : 0);
    e.gforceF.style.width = clamp(S.gForce / 2.6, 0, 1) * 100 + '%';

    e.kQ.className = 'key' + (IN.q ? ' on' : '');
    e.kW.className = 'key' + (IN.w ? ' on' : '');
    e.kE.className = 'key' + (IN.e ? ' on' : '');
    const stanceTxt = S.tuck ? 'FULL TUCK — minimum drag'
      : [ 'Standing tall — skis flat, no edge',
          'Soft knees — casual, gentle edge',
          'Driving the boots — real edge grip',
          'Loaded up — maximum angulation' ][IN.effort];
    e.stanceTxt.textContent = stanceTxt;
    e.edgeDeg.textContent = Math.round(S.edgeAngle / DEG) + '°';
    const eL = S.edge < 0 ? Math.abs(S.edge) * 100 : 0;
    const eR = S.edge > 0 ? S.edge * 100 : 0;
    e.edgeL.style.width = eL / 2 + '%';
    e.edgeR.style.width = eR / 2 + '%';

    e.stabF.style.width = clamp(S.risk, 0, 1) * 100 + '%';
    e.stabTxt.textContent = S.risk > 0.82 ? 'ABOUT TO GO' : S.risk > 0.55 ? 'GETTING LOOSE'
      : S.risk > 0.28 ? 'WORKING' : 'SOLID';
    e.stabTxt.style.color = S.risk > 0.55 ? '#fca5a5' : '#8fa6c6';

    this.toastT = Math.max(0, this.toastT - dt);
    e.toast.className = this.toastT > 0 ? 'on' : '';
    this.airT = Math.max(0, this.airT - dt);
    e.airTime.style.opacity = (S.air && S.airT > 0.35) ? '1' : (this.airT > 0 ? '1' : '0');
    if (S.air && S.airT > 0.35) e.airTime.textContent = 'AIR ' + S.airT.toFixed(1) + 's';
    e.warn.style.opacity = S.offPiste > 0.4 ? '1' : '0';
    e.warn.textContent = S.offPiste > 0.4 ? 'OFF PISTE' : '';

    // position marker on the upcoming-runs strip
    if (this.stripSecs.length) {
      const a = this.stripSecs[0].startZ, b = this.stripSecs[this.stripSecs.length - 1].endZ;
      e.stripMe.style.bottom = clamp((S.z - a) / (b - a), 0, 1) * 100 + '%';
    }
  },
};

/* ================================================================ GAME ==== */
const GAME = {
  state: 'title',      // title | run | paused | crash | over
  clock: 0, crashT: 0, timeScale: 1, crashReason: '', acc: 0,
  fpsT: 0, fpsN: 0, fps: 60, best: 0,

  space() {
    if (this.state === 'title' || this.state === 'over') { this.start(); return; }
    if (this.state === 'paused') { this.togglePause(); return; }
    if (this.state === 'run') IN.pop = true;
  },
  togglePause() {
    if (this.state === 'run') { this.state = 'paused'; this.screen('pause'); }
    else if (this.state === 'paused') { this.state = 'run'; this.hideScreen(); AU.resume(); }
  },
  restart() { if (this.state !== 'title') this.start(); },

  start() {
    AU.init(); AU.resume(); AU.revive();
    COURSE.sections.length = 0; COURSE.nextIdx = 0; COURSE.nextZ = 0;
    COURSE.elev.length = 0; COURSE.elevZ0 = 0; COURSE.kickers.length = 0;
    COURSE.chunks.clear(); COURSE._cacheIdx = 0;
    clearZCache();
    TRACKS.length = 0; PARTS.length = 0; ragdoll = null; lastTrackZ = -1e9;
    NPCS.length = 0; npcSpawnT = 0;
    resetSkier();
    cam.x = S.x; cam.z = S.z - 8; cam.y = S.y + 3; cam.yaw = 0; cam.shake = 0;
    HUD.lastSec = null; HUD.toastT = 0; HUD.airT = 0;
    this.timeScale = 1; this.crashT = 0; this.crashReason = '';
    this.state = 'run';
    this.hideScreen();
    $('hud').className = 'on';
  },

  hideScreen() { $('screens').className = 'hide'; },
  screen(kind) {
    const c = $('card');
    if (kind === 'title') {
      c.innerHTML = `
        <h1>FALL&nbsp;LINE</h1>
        <div class="tag">AN ENDLESS ALPINE DESCENT</div>
        <p class="blurb">The mountain never ends. It only gets steeper. Green cord gives way to blue,
        blue to red, and eventually to things with two black diamonds and a sign that just says
        <em>no fall zone</em>. Every metre is generated as you reach it — pitch, moguls, rollers,
        trees, lift line and all.</p>
        <div class="ctrls">
          <div class="ctrl"><b>STEER</b><span><kbd>←</kbd><kbd>→</kbd> lean into the turn. Hold longer to bring
            the skis further across the fall line.</span></div>
          <div class="ctrl"><b>EFFORT — Q / W / E</b><span>Nothing pressed = standing tall, skis flat, barely a turn.
            <kbd>Q</kbd> soft knees. <kbd>Q</kbd><kbd>W</kbd> real edge — hold a direction and you'll come parallel and stop.
            <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> everything you've got: instant edge, sharp turn.</span></div>
          <div class="ctrl"><b>TUCK</b><span><kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> with no steering folds you into a
            racing tuck — drag drops through the floor and the speed goes silly.</span></div>
          <div class="ctrl"><b>POP</b><span><kbd>SPACE</kbd> unweights the skis. More effort = more pop. Land with
            your knees bent or you'll blow it.</span></div>
          <div class="ctrl"><b>BALANCE</b><span>Speed you can't hold, rough snow and washed-out edges eat your balance.
            Bend the knees to buy it back — or ragdoll down the hill.</span></div>
          <div class="ctrl"><b>TRAFFIC</b><span>The mountain is shared. Crowds build on the groomed greens and blues
            the further you get — and thin right out on the blacks. Hit another skier and you both go down.</span></div>
          <div class="ctrl"><b>ALSO</b><span><kbd>P</kbd> pause · <kbd>R</kbd> restart · <kbd>M</kbd> mute.
            Keep it between the orange poles.</span></div>
        </div>
        <div class="legend">
          ${DIFFS.map(d => `<span class="lg"><i style="background:${d.col};border-radius:${d.shape === 'circle' ? '50%' : '0'};
            ${d.shape === 'diamond' || d.shape === 'double' ? 'transform:rotate(45deg)' : ''}"></i>${d.label}
            <span style="color:#64789b;font-weight:700">${d.slope[0]}–${d.slope[1]}°</span></span>`).join('')}
        </div>
        <div class="go">PRESS SPACE TO DROP IN</div>
        <div class="hint">Sound is generated live and reacts to your speed — headphones recommended.</div>`;
    } else if (kind === 'pause') {
      c.innerHTML = `<h1 style="font-size:52px">PAUSED</h1>
        <div class="tag">${Math.round(S.dist)} M DOWN · ${Math.round(S.maxSpeed * 3.6)} KM/H TOP</div>
        <div class="go">PRESS SPACE OR P TO CARRY ON</div>
        <div class="hint"><kbd>R</kbd> to start a fresh descent.</div>`;
    } else if (kind === 'over') {
      const avg = S.time > 0.5 ? (S.dist / S.time) * 3.6 : 0;
      const secs = Math.max(1, S.time);
      const deepest = DIFFS[clamp(S.maxDiff, 0, 4)];
      const grade = S.dist > 6000 ? 'YOU LIVE HERE, DON’T YOU'
        : S.dist > 4000 ? 'SEASON PASS ENERGY'
        : S.dist > 2500 ? 'STRONG DESCENT'
        : S.dist > 1400 ? 'SOLID RUN'
        : S.dist > 700  ? 'GETTING THE FEEL'
        : 'BOOK A LESSON';
      const isBest = S.dist > this.best;
      this.best = Math.max(this.best, S.dist);
      c.innerHTML = `
        <h1 class="crash" style="font-size:clamp(34px,6.5vw,62px)">YARD SALE</h1>
        <div id="crashWhy">${this.crashReason}</div>
        <div class="stats">
          <div class="st"><b>${Math.round(S.dist).toLocaleString()}</b><span>METRES</span></div>
          <div class="st"><b>${Math.round(avg)}</b><span>AVG KM/H</span></div>
          <div class="st"><b>${Math.round(S.maxSpeed * 3.6)}</b><span>TOP KM/H</span></div>
          <div class="st"><b>${Math.round(S.drop).toLocaleString()}</b><span>VERTICAL M</span></div>
          <div class="st"><b>${(Math.floor(secs / 60))}:${String(Math.floor(secs % 60)).padStart(2, '0')}</b><span>ON SNOW</span></div>
          <div class="st"><b>${S.bestAir.toFixed(1)}s</b><span>BEST AIR</span></div>
          <div class="st"><b>${S.passes}</b><span>SKIERS PASSED</span></div>
        </div>
        <div id="grade">${grade}</div>
        <div id="best">${isBest ? '★ NEW BEST DISTANCE' : 'BEST THIS SESSION · ' + Math.round(this.best).toLocaleString() + ' m'}
          &nbsp;·&nbsp; DEEPEST PISTE REACHED · <span style="color:${deepest.col === '#000000' ? '#94a3b8' : deepest.col}">${deepest.label}</span></div>
        <div><span class="btn" onclick="GAME.start()">DROP IN AGAIN</span></div>
        <div class="hint">or press <kbd>R</kbd> / <kbd>SPACE</kbd></div>`;
    }
    $('screens').className = '';
    if (kind === 'over') $('hud').className = '';
  },
};

/* ================================================================ LOOP ==== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;

  GAME.fpsN++; GAME.fpsT += dt;
  if (GAME.fpsT > 0.5) { GAME.fps = GAME.fpsN / GAME.fpsT; GAME.fpsN = 0; GAME.fpsT = 0;
    HUD.el.fps && (HUD.el.fps.textContent = Math.round(GAME.fps) + ' FPS');
    if (GAME.fps < 46 && ROWS > 20) { ROWS -= 2; COLS -= 2; }
    else if (GAME.fps > 57 && ROWS < 44) { ROWS += 1; COLS += 1; }
  }

  if (GAME.state === 'run' || GAME.state === 'crash') {
    const sdt = dt * GAME.timeScale;
    GAME.clock += sdt;
    readInput();
    ensureCourse(S.z + 400);
    refreshKickers(S.z);

    if (GAME.state === 'run') {
      GAME.acc += sdt;
      const H_STEP = 1 / 180;
      let n = 0;
      while (GAME.acc >= H_STEP && n++ < 12) { stepPhysics(H_STEP); GAME.acc -= H_STEP; }
      pushTrack();
    } else {
      GAME.crashT += dt;
      GAME.timeScale = lerp(0.32, 1, clamp((GAME.crashT - 0.5) / 1.4, 0, 1));
      stepRagdoll(sdt);
      if (GAME.crashT > 3.1) { GAME.state = 'over'; GAME.screen('over'); }
    }

    stepNpcs(sdt);
    stepParts(sdt);
    for (const t of TRACKS) t.age += sdt;
    pruneCourse(S.z);
    updateCamera(dt);
    AU.update(dt, S);
    if (GAME.state === 'run') HUD.update(dt);
  }

  render(dt);
}

function render(dt) {
  if (W !== Math.floor(innerWidth * DPR)) resize();
  focal = (H * 0.5) / Math.tan((0.92 + cam.fovBoost) * 0.5);
  const sk = cam.shake;
  shakeX = (Math.random() - 0.5) * sk * 14 * DPR;
  shakeY = (Math.random() - 0.5) * sk * 14 * DPR;

  updateCamBasis();
  const horizon = drawSky();
  if (GAME.state !== 'title') {
    buildRenderList();
    drawTerrain(horizon);
    drawSnowfall(dt);
    drawPost();
  } else {
    // idle title backdrop: a slow drift over the first pitch
    GAME.clock += dt;
    cam.z += dt * 3.5; cam.x = centerAt(cam.z) + Math.sin(GAME.clock * 0.22) * 9;
    cam.y = terrainH(cam.x, cam.z) + 4.2;
    cam.pitch = 0.34 + Math.sin(GAME.clock * 0.13) * 0.05;
    cam.yaw = Math.sin(GAME.clock * 0.17) * 0.16;
    ensureCourse(cam.z + 400); refreshKickers(cam.z); pruneCourse(cam.z);
    S.z = cam.z; S.x = cam.x;
    stepNpcs(dt);
    buildRenderList();
    drawTerrain(horizon);
    drawSnowfall(dt);
  }
}

/* ================================================================ BOOT ==== */
resize();
HUD.init();
ensureCourse(500);
resetSkier();
cam.x = S.x; cam.z = -10; cam.y = S.y + 4;
GAME.screen('title');
requestAnimationFrame(frame);

// first gesture anywhere unlocks audio
const unlock = () => { AU.init(); AU.resume(); removeEventListener('pointerdown', unlock); removeEventListener('keydown', unlock); };
addEventListener('pointerdown', unlock);
addEventListener('keydown', unlock);
$('screens').addEventListener('pointerdown', e => { if (e.target.id === 'screens' || e.target.id === 'card') GAME.space(); });
</script>
</body>
</html>
