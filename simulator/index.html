<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FALL LINE — an endless alpine descent</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070b14;
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf2ff;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  /* the scene behind the HUD is bright snow, so panels need real weight */
  .panel{position:absolute;background:rgba(9,17,33,.70);border:1px solid rgba(150,192,255,.22);
    border-radius:12px;padding:9px 13px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 6px 26px rgba(6,14,30,.30)}
  .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7f97bb;font-weight:700}
  .val{font-variant-numeric:tabular-nums;font-weight:800;line-height:1}

  #runInfo{top:16px;left:16px;min-width:210px}
  #runName{font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:3px;text-shadow:0 1px 6px #000}
  #diffPill{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:3px 10px 3px 7px;

  #diffGlyph{display:inline-block;width:11px;height:11px;background:currentColor}
  #pitchRead{margin-top:7px;font-size:10.5px;color:#93a9c9;letter-spacing:.06em}

  #dist{top:16px;left:50%;transform:translateX(-50%);text-align:center;min-width:170px}
  #distVal{font-size:27px}
  #dropVal{font-size:11px;color:#8fa6c6;margin-top:4px;font-variant-numeric:tabular-nums}

  #spd{top:16px;right:16px;text-align:right;min-width:158px}
  #spdVal{font-size:40px;letter-spacing:-.02em}
  #spdVal small{font-size:13px;color:#7f97bb;font-weight:700;letter-spacing:.1em;margin-left:5px}
  #spdSub{font-size:10.5px;color:#8fa6c6;margin-top:3px;font-variant-numeric:tabular-nums}
  #gforce{margin-top:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #gforceF{height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#a78bfa);transition:width .06s}

  #stance{bottom:16px;left:16px;min-width:236px}
  #keys{display:flex;gap:7px;margin-top:7px}
  .key{flex:1;text-align:center;padding:7px 0 6px;border-radius:8px;border:1px solid rgba(160,200,255,.2);
    background:rgba(255,255,255,.045);font-weight:900;font-size:14px;color:#5d739a;
    transition:background .08s,color .08s,box-shadow .08s}
  .key.on{background:linear-gradient(180deg,#7dd3fc,#38bdf8);color:#04202e;border-color:#bae6fd;
    box-shadow:0 0 16px rgba(56,189,248,.55)}
  .key i{display:block;font-style:normal;font-size:8px;letter-spacing:.08em;opacity:.72;margin-top:2px;font-weight:700}
  #stanceTxt{margin-top:8px;font-size:11px;color:#a9c0dd;letter-spacing:.03em;height:14px}
  #edgeWrap{margin-top:8px}
  #edgeBar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px;
    display:flex;justify-content:center}
  #edgeL,#edgeR{height:100%;width:0%;background:linear-gradient(90deg,#fbbf24,#f97316)}
  #edgeL{transform-origin:right}

  #stab{bottom:16px;right:16px;min-width:186px}
  #stabBar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:7px}
  #stabF{height:100%;width:0%;background:linear-gradient(90deg,#34d399,#fbbf24 62%,#ef4444);transition:width .05s}
  #stabTxt{margin-top:6px;font-size:10px;letter-spacing:.1em;color:#8fa6c6;font-weight:700;height:12px}

  /* upcoming-runs strip */
  #strip{position:absolute;right:16px;top:132px;width:22px;bottom:136px;border-radius:7px;
    overflow:hidden;border:1px solid rgba(150,192,255,.26);background:rgba(9,17,33,.70);
    display:flex;flex-direction:column-reverse;backdrop-filter:blur(9px);
    box-shadow:0 6px 26px rgba(6,14,30,.30)}
  .seg{width:100%;position:relative;border-top:1px solid rgba(226,240,255,.55)}
  #stripMe{position:absolute;left:0;width:100%;height:0;border-top:2px solid #fff;
    box-shadow:0 0 9px rgba(255,255,255,.95);z-index:2}
  #stripMe::after{content:'';position:absolute;left:-3px;top:-4px;border:4px solid transparent;
    border-left-color:#fff;filter:drop-shadow(0 0 3px rgba(255,255,255,.9))}

  /* centre toasts */
  #toast{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%);text-align:center;
    pointer-events:none;opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}
  #toastDiff{font-size:11px;font-weight:900;letter-spacing:.3em;padding:4px 14px;border-radius:999px;display:inline-block}
  #toastName{font-size:34px;font-weight:900;letter-spacing:.02em;margin-top:9px;text-shadow:0 3px 22px rgba(0,0,0,.85)}
  #toastSub{font-size:11.5px;letter-spacing:.22em;color:#cfe0f7;margin-top:6px;font-weight:700}

  #alerts{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);text-align:center;width:420px}
  #airTime{font-size:30px;font-weight:900;letter-spacing:.05em;opacity:0;transition:opacity .18s;
    text-shadow:0 3px 18px rgba(0,0,0,.8);color:#e0f2fe}

  /* ---------- SCREENS ---------- */
  #screens{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 34%,rgba(16,30,56,.6),rgba(4,7,14,.94));
    backdrop-filter:blur(3px);transition:opacity .35s}
  #screens.hide{opacity:0;pointer-events:none}
  .card{width:min(860px,92vw);max-height:92vh;overflow:auto;padding:28px 32px 26px;text-align:center}
  h1{font-size:clamp(40px,8vw,78px);font-weight:900;letter-spacing:-.03em;line-height:.92;
    background-image:linear-gradient(180deg,#fff,#8fc7ff 62%,#4b8fd4);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 4px 26px rgba(70,140,220,.4))}
  /* NB: override with background-IMAGE only — the `background` shorthand
     resets background-clip and the heading turns into a solid bar. */
  h1.crash{background-image:linear-gradient(180deg,#fff,#fca5a5 68%,#ef4444);
    filter:drop-shadow(0 4px 26px rgba(220,70,70,.42))}
  .tag{font-size:11px;letter-spacing:.42em;color:#7ea6d8;margin-top:10px;font-weight:700}
  .blurb{margin:16px auto 0;max-width:600px;font-size:13.5px;line-height:1.65;color:#a9c0dd}
  .ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:9px;margin-top:22px;text-align:left}
  .ctrl{background:rgba(255,255,255,.045);border:1px solid rgba(160,200,255,.14);border-radius:10px;padding:11px 13px}
  .ctrl b{display:block;font-size:11px;letter-spacing:.11em;color:#7dd3fc;margin-bottom:4px;font-weight:800}
  .ctrl span{font-size:11.5px;color:#a9c0dd;line-height:1.5}
  kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;font:inherit;font-size:10.5px;
    font-weight:800;color:#e6f0ff;margin:0 1px}
  .legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:20px}
  .lg{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.11em;
    padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(160,200,255,.14)}
  .lg i{width:9px;height:9px;display:inline-block}
  .go{margin-top:24px;font-size:13px;letter-spacing:.24em;font-weight:900;color:#dbeafe;
    animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .btn{pointer-events:auto;cursor:pointer;margin-top:20px;display:inline-block;padding:12px 30px;
    border-radius:999px;font-weight:900;letter-spacing:.16em;font-size:12px;color:#04202e;
    background:linear-gradient(180deg,#93d7fb,#38bdf8);border:1px solid #bae6fd;
    box-shadow:0 8px 30px rgba(56,189,248,.35)}
  .btn:hover{filter:brightness(1.09)}
  .btn.ghost{background:transparent;color:#a9c0dd;border-color:rgba(160,200,255,.22);box-shadow:none;margin-left:8px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:10px;margin-top:22px}
  .st{background:rgba(255,255,255,.05);border:1px solid rgba(160,200,255,.14);border-radius:12px;padding:14px 10px}
  .st b{display:block;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .st span{display:block;font-size:9px;letter-spacing:.17em;color:#7f97bb;margin-top:5px;font-weight:800}
  #grade{font-size:15px;font-weight:900;letter-spacing:.2em;margin-top:20px;color:#7dd3fc}
  #crashWhy{font-size:12.5px;color:#fca5a5;letter-spacing:.13em;font-weight:800;margin-top:9px}
  #best{font-size:11px;color:#7f97bb;letter-spacing:.1em;margin-top:14px;font-weight:700}
  .hint{font-size:10.5px;color:#64789b;margin-top:16px;letter-spacing:.06em;line-height:1.7}
  #fps{position:absolute;left:18px;top:176px;font-size:9px;color:#546d92;letter-spacing:.1em;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="panel" id="runInfo">
      <div class="lbl">Current piste</div>
      <div id="runName">—</div>
      <div id="diffPill"><i id="diffGlyph"></i><span id="diffTxt">GREEN</span></div>
      <div id="pitchRead">—</div>
    </div>

    <div class="panel" id="dist">
      <div class="lbl">Distance</div>
      <div class="val" id="distVal">0<small style="font-size:13px;color:#7f97bb"> m</small></div>
      <div id="dropVal">▼ 0 m vertical</div>
    </div>

    <div class="panel" id="spd">
      <div class="lbl">Speed</div>
      <div class="val" id="spdVal">0<small>KM/H</small></div>

    </div>

      <div class="lbl">Stance &amp; effort</div>
      <div id="keys">
        <div class="key" id="kQ">Q<i>FLEX</i></div>
        <div class="key" id="kW">W<i>DRIVE</i></div>
        <div class="key" id="kE">E<i>SEND</i></div>
      </div>
      <div id="stanceTxt">Standing tall — no edge</div>
      <div id="edgeWrap">
        <div class="lbl">Edge angle <span id="edgeDeg" style="color:#cfe0f7">0°</span></div>
        <div id="edgeBar"><div id="edgeL"></div><div id="edgeR"></div></div>
      </div>
    </div>

    <div class="panel" id="stab">
      <div class="lbl">Balance</div>

    <div id="strip"><div id="stripMe"></div></div>

      <div id="toastDiff">RED</div>

    </div>

      <div id="airTime">AIR 0.0s</div>

  <div id="screens">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   FALL LINE — an endless procedural alpine descent
   Everything (terrain, art, physics, music) is generated at runtime.
   ========================================================================= */

/* ---------------------------------------------------------------- math ---- */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth= t => t * t * (3 - 2 * t);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a || 1e-6), 0, 1); return t * t * (3 - 2 * t); };
const rnd   = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[(Math.random() * arr.length) | 0];

function hashi(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  const a = hashi(xi, yi), b = hashi(xi + 1, yi), c = hashi(xi, yi + 1), d = hashi(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); norm += amp; f *= 2.07; amp *= 0.5; }
  return s / norm;
}
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------ constants --- */
const PHYS = {
  M: 80,             // skier + kit, kg
  G: 9.81,
  RHO: 1.15,         // air density at ~2000 m
  R_SIDECUT: 16.5,   // ski sidecut radius, m
  MU_PISTE: 0.055,   // groomed snow / base glide
  MU_POWDER: 0.135,  // off piste
  // per effort level 0..3
  CDA:       [0.86, 0.68, 0.52, 0.44],   // frontal drag area, m^2 (turning)
  CDA_TUCK:  0.235,                       // full tuck, QWE and no steering
  EDGE_MAX:  [7 * DEG, 27 * DEG, 48 * DEG, 66 * DEG],
  EDGE_RATE: [2.4, 4.0, 6.2, 9.5],       // how fast the edge sets, rad/s of travel
  PIVOT:     [0.22, 0.62, 1.15, 2.25],   // skidded steering authority, rad/s
  GRIP:      [0.34, 0.85, 1.42, 1.92],   // max lateral g the edges will hold
  COMFORT:   [12.5, 18.5, 25.5, 32.5],   // m/s before balance starts to erode
  ABSORB:    [5.6, 9.4, 13.8, 18.6],     // landing impact the legs will eat, m/s
  POP:       [1.5, 2.9, 4.2, 5.6],
};

const DIFFS = [
  // width is the HALF-width of the piste in metres, before widthMod()
  { key:'green', label:'GREEN',        col:'#22c55e', ink:'#04220f', shape:'circle', slope:[9,13],  width:[19,25], mogul:0.00, rough:0.22, trees:0.40, roll:0.70, kick:0.15, glade:0    },
  { key:'blue',  label:'BLUE',         col:'#3b82f6', ink:'#dbeafe', shape:'square', slope:[14,19], width:[15,20], mogul:0.14, rough:0.40, trees:0.62, roll:1.00, kick:0.30, glade:0    },
  { key:'red',   label:'RED',          col:'#ef4444', ink:'#fee2e2', shape:'diamond',slope:[21,27], width:[11,15], mogul:0.42, rough:0.60, trees:0.88, roll:1.25, kick:0.45, glade:0.15 },
  { key:'black', label:'BLACK',        col:'#0f172a', ink:'#e2e8f0', shape:'diamond',slope:[29,36], width:[8.5,12], mogul:0.76, rough:0.85, trees:1.10, roll:1.45, kick:0.58, glade:0.35 },
  { key:'xblack',label:'DOUBLE BLACK', col:'#000000', ink:'#f8fafc', shape:'double', slope:[37,45], width:[7,10],  mogul:0.98, rough:1.08, trees:1.30, roll:1.65, kick:0.70, glade:0.55 },
];

const NAMES = [
  ['Petit Ours','Promenade','Le Berceau','Sunnegga','Alpenrose','Marmot Meadow','Le Doux','Kinderweg','Bella Vista','Lärchenwald'],
  ['Le Grand Bleu','Chamois','Panorama','Silberhorn','Belvédère','Blaugrat','La Combe','Edelweiss','Mittelweg','Lac Bleu'],
  ['Rouge Vif','Diavolezza','Le Couloir','Steilhang','La Face','Vallée Perdue','Hexenkessel','Aiguille','Rossignol','Cresta Rossa'],
  ['Le Mur','Schwarzwand','La Bombardier','Corbeau','Todeswand','Grand Couloir','Le Tunnel','Wolfsschlucht','La Sauvage','Nera'],
  ['La Suicide','Diablerets','Höllenschlund','Le Dernier Cri','Zermatt Direttissima','La Chute','Der Sarg','Point of No Return'],
];

const RUN_TAGS = ['GROOMED AT 05:00','MOGULS','NARROW — CAUTION','WIND EXPOSED','GLADED','ICY IN PLACES','WIDE OPEN','ROLLERS','FRESH CORD','AVALANCHE ZONE','NO FALL ZONE','RACE TRAINING'];

/* ============================================================== COURSE ==== */
const ELEV_STEP = 1.0;
const COURSE = {
  sections: [], nextIdx: 0, nextZ: 0,
  elev: [], elevZ0: 0,
  kickers: [],
  chunks: new Map(),
  _cacheIdx: 0,
};

/* The piste snakes down the mountain across five scales at once: broad
   traverses across the face, then progressively tighter turns. The short
   components are what actually force you to ski — the long ones only move
   the trail across the mountain. Peak lateral gradient ~0.85 m/m (40° off
   the fall line), typical ~0.28, so the corridor is genuinely going
   somewhere and you cannot hold a straight line down it. */
function centerAt(z) {
  return 26.0 * Math.sin(z * 0.00410)
       + 13.0 * Math.sin(z * 0.01210 + 1.7)
       +  7.5 * Math.sin(z * 0.02630 + 0.6)
       +  4.0 * Math.sin(z * 0.05180 + 2.9)
       +  2.2 * Math.sin(z * 0.08990 + 1.2);
}
/* second derivative of the above — the piste banks into its own turns */
function centerCurv(z) {
  return -(26.0 * 0.00410 * 0.00410 * Math.sin(z * 0.00410)
         + 13.0 * 0.01210 * 0.01210 * Math.sin(z * 0.01210 + 1.7)
         +  7.5 * 0.02630 * 0.02630 * Math.sin(z * 0.02630 + 0.6)
         +  4.0 * 0.05180 * 0.05180 * Math.sin(z * 0.05180 + 2.9)
         +  2.2 * 0.08990 * 0.08990 * Math.sin(z * 0.08990 + 1.2));
}
/* Chokes and openings within a run: pinches to ~62% of nominal width, opens
   out to full. This is on top of the per-section width. */
function widthMod(z) {
  const a = 0.5 + 0.5 * Math.sin(z * 0.01730 + 0.9);
  const b = 0.5 + 0.5 * Math.sin(z * 0.00710 + 2.3);
  return 0.62 + 0.38 * (0.35 + 0.65 * a) * (0.45 + 0.55 * b) * 1.35;
}
function liftX(z) { return 74 + 16 * Math.sin(z * 0.0021 + 0.4) + centerAt(z) * 0.35; }

function makeSection() {
  const i = COURSE.nextIdx++;
  // difficulty ramps, with the occasional breather
  let lvl = 0.15 + i * 0.40 + (vnoise(i * 0.63, 11.2) - 0.5) * 1.5;
  if (i > 3 && i % 5 === 4) lvl -= 1.35;                 // recovery run
  if (i === 0) lvl = 0; if (i === 1) lvl = Math.min(lvl, 1.2);
  const d = clamp(Math.round(lvl), 0, 4);
  const D = DIFFS[d];
  const len = rnd(360, 620);
  const s = {
    idx: i, diff: d, D,
    startZ: COURSE.nextZ, endZ: COURSE.nextZ + len,
    name: NAMES[d][(i * 7 + ((Math.random() * 97) | 0)) % NAMES[d].length],
    tag: pick(RUN_TAGS),
    slope: rnd(D.slope[0], D.slope[1]) * DEG,
    width: rnd(D.width[0], D.width[1]),
    mogul: D.mogul * rnd(0.55, 1.25) * (Math.random() < 0.62 ? 1 : 0.22),
    rough: D.rough * rnd(0.8, 1.2),
    roll:  D.roll  * rnd(0.7, 1.3),
    trees: D.trees, kick: D.kick, glade: D.glade * (Math.random() < 0.5 ? 1 : 0),
    phase: Math.random() * TAU,
    number: 1 + ((i * 3 + d) % 40),
  };
  COURSE.nextZ = s.endZ;
  COURSE.sections.push(s);

  // kickers / rollers you can actually launch off
  let z = s.startZ + 60;
  while (z < s.endZ - 60) {
    if (Math.random() < s.kick) {
      COURSE.kickers.push({
        z, x: centerAt(z) + rnd(-0.45, 0.45) * s.width,
        h: rnd(1.1, 1.4 + s.kick * 2.2), rx: rnd(3.2, 6.4), rz: rnd(5.5, 10),
      });
    }
    z += rnd(70, 150);
  }
  return s;
}

function slopeBlendAt(z) {          // smooth pitch across section joins
  const S = COURSE.sections;
  const i = sectionIndexAt(z), s = S[i], BL = 55;
  if (z < s.startZ + BL && i > 0) {
    const t = 0.5 * (1 - sstep(s.startZ, s.startZ + BL, z));
    return lerp(s.slope, S[i - 1].slope, t);
  }
  if (z > s.endZ - BL && i < S.length - 1) {
    const t = 0.5 * sstep(s.endZ - BL, s.endZ, z);
    return lerp(s.slope, S[i + 1].slope, t);
  }
  return s.slope;
}

function sectionIndexAt(z) {
  const S = COURSE.sections;
  let i = COURSE._cacheIdx;
  if (i < S.length && z >= S[i].startZ && z < S[i].endZ) return i;
  if (z < S[0].startZ) return 0;
  if (z >= S[S.length - 1].endZ) return S.length - 1;
  let lo = 0, hi = S.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (z < S[m].endZ) hi = m; else lo = m + 1; }
  COURSE._cacheIdx = lo;
  return lo;
}

const P = { slope:0, width:0, mogul:0, rough:0, roll:0, phase:0, diff:0, sec:null };
function paramsAt(z) {
  const S = COURSE.sections;
  const i = sectionIndexAt(z), s = S[i], BL = 55;
  let o = s, t = 0;
  if (z < s.startZ + BL && i > 0)            { o = S[i - 1]; t = 0.5 * (1 - sstep(s.startZ, s.startZ + BL, z)); }
  else if (z > s.endZ - BL && i < S.length-1){ o = S[i + 1]; t = 0.5 * sstep(s.endZ - BL, s.endZ, z); }
  P.slope = lerp(s.slope, o.slope, t);
  P.width = lerp(s.width, o.width, t) * widthMod(z);   // chokes and openings
  P.mogul = lerp(s.mogul, o.mogul, t);
  P.rough = lerp(s.rough, o.rough, t);
  P.roll  = lerp(s.roll,  o.roll,  t);
  P.phase = s.phase; P.diff = s.diff; P.sec = s;
  return P;
}

function ensureCourse(zAhead) {
  while (COURSE.nextZ < zAhead + 900) makeSection();
  // elevation profile, integrated from the pitch
  const E = COURSE.elev;
  if (E.length === 0) { COURSE.elevZ0 = -40; E.push(0); }
  let zEnd = COURSE.elevZ0 + (E.length - 1) * ELEV_STEP;
  while (zEnd < zAhead + 950) {
    E.push(E[E.length - 1] - Math.tan(slopeBlendAt(zEnd + ELEV_STEP * 0.5)) * ELEV_STEP);
    zEnd += ELEV_STEP;
  }
}
function pruneCourse(z) {
  const drop = Math.floor((z - 400 - COURSE.elevZ0) / ELEV_STEP);
  if (drop > 600) { COURSE.elev.splice(0, drop); COURSE.elevZ0 += drop * ELEV_STEP; }
  while (COURSE.sections.length > 2 && COURSE.sections[1].endZ < z - 300) {
    COURSE.sections.shift(); COURSE._cacheIdx = Math.max(0, COURSE._cacheIdx - 1);
  }
  while (COURSE.kickers.length && COURSE.kickers[0].z < z - 220) COURSE.kickers.shift();
  for (const k of COURSE.chunks.keys()) if (k * CHUNK < z - 140) COURSE.chunks.delete(k);
}
function baseElev(z) {
  const E = COURSE.elev;
  const f = (z - COURSE.elevZ0) / ELEV_STEP;
  let i = f | 0;
  if (i < 0) return E[0] - (z - COURSE.elevZ0) * 0.2;
  if (i >= E.length - 1) return E[E.length - 1];
  return lerp(E[i], E[i + 1], f - i);
}

/* active kickers, refreshed once per frame (keeps terrainH cheap) */
let activeKick = [], activeKickN = 0;
function refreshKickers(z) {
  activeKick.length = 0;
  for (let i = 0; i < COURSE.kickers.length; i++) {
    const k = COURSE.kickers[i];
    if (k.z > z - 60 && k.z < z + 260) activeKick.push(k);
    else if (k.z >= z + 260) break;
  }
  activeKickN = activeKick.length;
}

/* --------------------------------------------------------- height field --
   Everything that only depends on z is cached: the sampler walks the grid
   row by row, so the same z is asked for dozens of times in a row.          */
const _ZC = [{z:NaN},{z:NaN},{z:NaN},{z:NaN},{z:NaN},{z:NaN}];
let _zci = 0;
function clearZCache() { for (const c of _ZC) c.z = NaN; }
function zData(z) {
  for (let i = 0; i < 6; i++) if (_ZC[i].z === z) return _ZC[i];
  const c = _ZC[_zci]; _zci = (_zci + 1) % 6;
  const p = paramsAt(z);
  c.z = z;
  c.base   = baseElev(z);
  c.center = centerAt(z);
  // Bank strength scales with pitch. It must not: the bank changes down-slope
  // as the curvature does, and unscaled that gradient reaches 84% of a green's
  // fall line — enough to flatten it into a pocket you can never roll out of.
  c.curv   = centerCurv(z) * 26 * clamp(Math.sin(p.slope) * 2, 0.22, 1.3);
  c.width  = p.width;
  // Max cross-slope gradient of the berm outside the markers. Anything shaped
  // by distance-from-centre inherits the centreline's z-gradient, so a steep
  // berm on a hard-swerving trail makes uphill pockets. Keep it well under the
  // fall line, and scale with pitch.
  c.bermG  = 0.13 * clamp(Math.sin(p.slope) / 0.19, 0.85, 2.6);
  // Off-piste relief, pitch-scaled for the same reason. Measured, the two
  // drift octaves peak at 0.70 m/m of down-slope gradient — 361% of a green's
  // fall line, i.e. guaranteed uphill pockets. This holds them near 50% on
  // every grade; the *look* of deep snow is carried by shading instead, which
  // costs nothing physically. Steeper off-piste being rougher is also true.
  c.offAmp = clamp(Math.tan(p.slope) * 0.72, 0.16, 0.90);
  c.mogul  = p.mogul;
  c.rough  = p.rough;
  c.roll   = p.roll * 1.15 * Math.sin(z * 0.0575 + p.phase) * (0.62 + 0.38 * Math.sin(z * 0.0187 + 2.1));
  return c;
}

function terrainH(x, z) {
  const c = zData(z);
  let h = c.base + c.roll;
  const dx = x - c.center, adx = dx < 0 ? -dx : dx;
  const hw = c.width;

  // gentle crown on the piste, then banks rising outside the markers
  h -= 0.00085 * dx * dx * (adx < hw ? 1 : (hw * hw) / (adx * adx));
  // smooth start, then asymptotically linear at gradient bermG
  const over = adx - hw;
  if (over > 0) h += c.bermG * over * over / (over + 6);

  const onPiste = 1 - sstep(hw * 0.86, hw * 1.16, adx);

  // The piste banks into its own turns — outside edge rides higher. Scaled by
  // dx/hw so a narrow couloir banks as hard as a wide green.
  h += clamp(-(dx / hw) * c.curv, -2.4, 2.4) * onPiste;

  // moguls — a rotated hex-ish lattice, only where the piste is
  if (c.mogul > 0.02 && onPiste > 0.01) {
    const a = x * 0.92 + z * 0.37, b = z * 0.84 - x * 0.32;
    h += c.mogul * 0.50 * onPiste * (Math.sin(a) + Math.sin(b) + 0.55 * Math.sin(a + b));
  }

  // surface texture / chatter
  h += c.rough * 0.32 * (fbm(x * 0.075, z * 0.075, 2) - 0.5);
  // Off piste is naturally stacked snow: broad wind drifts with a finer lumpy
  // crust on top. Two scales, because one octave reads as smooth rolling hills.
  if (onPiste < 0.98) {
    const off = (1 - onPiste) * c.offAmp;
    h += off * 1.60 * (fbm(x * 0.115, z * 0.115, 3) - 0.5);
    h += off * 0.46 * (fbm(x * 0.440, z * 0.440, 2) - 0.5);
  }

  // kickers
  for (let i = 0; i < activeKickN; i++) {
    const k = activeKick[i], kz = z - k.z;
    if (kz < -k.rz * 1.9 || kz > k.rz * 1.25) continue;
    const kx = (x - k.x) / k.rx;
    if (kx > 1.7 || kx < -1.7) continue;
    const ramp = sstep(-k.rz * 1.7, k.rz * 0.42, kz) * (1 - sstep(k.rz * 0.5, k.rz * 1.05, kz));
    h += k.h * ramp * Math.exp(-kx * kx * 1.35);
  }
  return h;
}

const NRM = { x:0, y:1, z:0 };
function terrainN(x, z, eps) {
  eps = eps || 0.55;
  const h0 = terrainH(x, z);
  const hx = terrainH(x + eps, z) - h0;
  const hz = terrainH(x, z + eps) - h0;
  let nx = -hx / eps, ny = 1, nz = -hz / eps;
  const l = Math.hypot(nx, ny, nz);
  NRM.x = nx / l; NRM.y = ny / l; NRM.z = nz / l;
  return NRM;
}

/* ============================================================== OBJECTS === */
const CHUNK = 25;
const OBJ = { TREE:0, ROCK:1, POLE:2, SIGN:3, BANNER:4, TOWER:5, NET:6, GUN:7, HAY:8 };

function chunkAt(ci) {
  let list = COURSE.chunks.get(ci);
  if (list) return list;
  list = [];
  const R = mulberry(0x9e3779b1 ^ (ci * 2654435761));
  const z0 = ci * CHUNK, z1 = z0 + CHUNK;
  if (z1 > COURSE.nextZ - 40 || z0 < COURSE.elevZ0 + 4) { COURSE.chunks.set(ci, list); return list; }

  const p = paramsAt(z0 + CHUNK * 0.5);
  const sec = p.sec, cx = centerAt(z0 + CHUNK * 0.5), hw = p.width;

  // section furniture — sign pair + gate banner at the top of every run
  if (sec.startZ >= z0 && sec.startZ < z1) {
    const sz = sec.startZ, sc = centerAt(sz), sw = paramsAt(sz).width;
    list.push({ t:OBJ.BANNER, z:sz, x:sc, w:sw, sec, hard:true });
    list.push({ t:OBJ.SIGN, z:sz + 7, x:sc - sw - 2.6, sec, side:-1, hard:true });
    list.push({ t:OBJ.SIGN, z:sz + 7, x:sc + sw + 2.6, sec, side: 1, hard:true });
  }

  // piste markers, every 15 m each side, alternating colour
  for (let z = z0; z < z1; z += 15) {
    const zz = Math.ceil(z / 15) * 15;
    if (zz < z0 || zz >= z1) continue;
    const c = centerAt(zz), w = paramsAt(zz).width;
    const orange = ((zz / 15) | 0) % 2 === 0;
    list.push({ t:OBJ.POLE, z:zz, x:c - w, orange });
    list.push({ t:OBJ.POLE, z:zz, x:c + w, orange, right:true });
  }

  // B-net on the steeper stuff
  if (sec.diff >= 3 && R() < 0.45) {
    const side = R() < 0.5 ? -1 : 1;
    for (let z = z0; z < z1; z += 5) {
      const c = centerAt(z), w = paramsAt(z).width;
      list.push({ t:OBJ.NET, z, x:c + side * (w + 1.3), side, end:(z + 5 >= z1) });
    }
  }

  // trees — outside the markers, plus glades inside on the gnarly runs
  const nTree = Math.round(sec.trees * 13);
  for (let i = 0; i < nTree; i++) {
    const z = z0 + R() * CHUNK;
    const c = centerAt(z), w = paramsAt(z).width;
    const side = R() < 0.5 ? -1 : 1;
    let x = c + side * (w + 2.2 + Math.pow(R(), 0.62) * 52);
    if (sec.glade > 0 && R() < sec.glade * 0.5) x = c + (R() * 2 - 1) * w * 0.92;
    list.push({ t:OBJ.TREE, z, x, h:rnd(4.5, 12.5), kind:R() < 0.72 ? 0 : 1, seed:R() });
  }

  // rocks & terrain features
  const nRock = Math.round((0.7 + sec.diff * 0.75) * R() * 3);
  for (let i = 0; i < nRock; i++) {
    const z = z0 + R() * CHUNK;
    const c = centerAt(z), w = paramsAt(z).width;
    const inside = sec.diff >= 3 && R() < 0.34;
    const x = inside ? c + (R() * 2 - 1) * w * 0.85 : c + (R() < 0.5 ? -1 : 1) * (w + 1.5 + R() * 30);
    list.push({ t:OBJ.ROCK, z, x, r:rnd(0.55, 1.7), seed:R() });
  }

  // snow guns on the easier pistes
  if (sec.diff <= 2 && R() < 0.22) {
    const z = z0 + R() * CHUNK, c = centerAt(z), w = paramsAt(z).width;
    list.push({ t:OBJ.GUN, z, x:c + (R() < 0.5 ? -1 : 1) * (w + 1.8), seed:R() });
  }

  // chairlift towers every 60 m
  const tz = Math.ceil(z0 / 60) * 60;
  if (tz >= z0 && tz < z1) list.push({ t:OBJ.TOWER, z:tz, x:liftX(tz), h:rnd(9, 13.5) });

  // padded hay bales guarding the nasty stuff
  if (sec.diff >= 2 && R() < 0.15) {
    const z = z0 + R() * CHUNK, c = centerAt(z), w = paramsAt(z).width;
    list.push({ t:OBJ.HAY, z, x:c + (R() < 0.5 ? -1 : 1) * (w + 0.8), seed:R() });
  }

  for (const o of list) if (o.y === undefined) o.y = terrainH(o.x, o.z);
  list.sort((a, b) => b.z - a.z);
  COURSE.chunks.set(ci, list);
  return list;
}

/* ================================================================ AUDIO === */
const AU = {
  ctx:null, ok:false, muted:false,
  master:null, musicBus:null, sfxBus:null, delay:null, noiseBuf:null,
  wind:null, windGain:null, windFilt:null,
  carve:null, carveGain:null, carveFilt:null,
  chatter:null, chatterGain:null,
  step:0, nextT:0, bpm:96, intensity:0, prog:null, root:57, curDiff:-1,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -15; comp.knee.value = 26; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    this.master = ctx.createGain(); this.master.gain.value = 0.85;
    this.master.connect(comp); comp.connect(ctx.destination);

    this.musicBus = ctx.createGain(); this.musicBus.gain.value = 0.62; this.musicBus.connect(this.master);
    this.sfxBus   = ctx.createGain(); this.sfxBus.gain.value   = 0.95; this.sfxBus.connect(this.master);

    // ping-pong-ish delay for the arp / lead
    const d = ctx.createDelay(1.0); d.delayTime.value = 0.27;
    const fb = ctx.createGain(); fb.gain.value = 0.36;
    const dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2400;
    d.connect(dl); dl.connect(fb); fb.connect(d);
    const dw = ctx.createGain(); dw.gain.value = 0.42; d.connect(dw); dw.connect(this.musicBus);
    this.delay = d;

    // noise source used by every wind / snow-spray voice
    const n = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; last = (last + 0.03 * w) / 1.03; ch[i] = w * 0.72 + last * 2.6; }
    this.noiseBuf = buf;

    this.wind = this.loopNoise(); this.windFilt = ctx.createBiquadFilter();
    this.windFilt.type = 'bandpass'; this.windFilt.frequency.value = 480; this.windFilt.Q.value = 0.62;
    this.windGain = ctx.createGain(); this.windGain.gain.value = 0;
    this.wind.connect(this.windFilt); this.windFilt.connect(this.windGain); this.windGain.connect(this.sfxBus);

    this.carve = this.loopNoise(); this.carveFilt = ctx.createBiquadFilter();
    this.carveFilt.type = 'bandpass'; this.carveFilt.frequency.value = 1800; this.carveFilt.Q.value = 1.5;
    this.carveGain = ctx.createGain(); this.carveGain.gain.value = 0;
    this.carve.connect(this.carveFilt); this.carveFilt.connect(this.carveGain); this.carveGain.connect(this.sfxBus);

    this.chatter = this.loopNoise(); const cf = ctx.createBiquadFilter();
    cf.type = 'lowpass'; cf.frequency.value = 260; cf.Q.value = 6;
    this.chatterGain = ctx.createGain(); this.chatterGain.gain.value = 0;
    this.chatter.connect(cf); cf.connect(this.chatterGain); this.chatterGain.connect(this.sfxBus);

    this.nextT = ctx.currentTime + 0.12;
    this.setDifficulty(0);
    this.ok = true;
  },
  loopNoise() {
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf; s.loop = true; s.start();
    return s;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  setDifficulty(d) {
    if (d === this.curDiff) return;
    this.curDiff = d;
    const MAJ = [0,4,7,11], MIN = [0,3,7,10], SUS = [0,5,7,10], DIM = [0,3,6,10];
    const table = [
      { root:64, seq:[[0,MAJ],[7,MAJ],[9,MIN],[5,MAJ]] },
      { root:62, seq:[[0,MAJ],[5,MAJ],[7,SUS],[9,MIN]] },
      { root:57, seq:[[0,MIN],[10,MAJ],[5,MIN],[7,MIN]] },
      { root:55, seq:[[0,MIN],[8,MAJ],[3,MAJ],[10,MAJ]] },
      { root:53, seq:[[0,MIN],[1,MAJ],[0,MIN],[8,DIM]] },
    ][clamp(d, 0, 4)];
    this.root = table.root; this.prog = table.seq;
  },
  mtof: m => 440 * Math.pow(2, (m - 69) / 12),

  voice(o) {
    const ctx = this.ctx, t = o.t;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sawtooth';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + o.dur * (o.slide || 0.85));
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    const pk = o.g, a = o.a === undefined ? 0.008 : o.a;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(pk, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    let node = osc;
    if (o.filt) {
      const bf = ctx.createBiquadFilter();
      bf.type = o.ftype || 'lowpass'; bf.frequency.setValueAtTime(o.filt, t);
      if (o.filt2) bf.frequency.exponentialRampToValueAtTime(Math.max(60, o.filt2), t + o.dur);
      bf.Q.value = o.q || 1;
      osc.connect(bf); node = bf;
    }
    node.connect(g);
    g.connect(o.dest || this.musicBus);
    if (o.send) { const s = ctx.createGain(); s.gain.value = o.send; g.connect(s); s.connect(this.delay); }
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },
  noiseHit(o) {
    const ctx = this.ctx, t = o.t;
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = o.rate || 1;
    const bf = ctx.createBiquadFilter(); bf.type = o.ftype || 'bandpass';
    bf.frequency.setValueAtTime(o.f, t);
    if (o.f2) bf.frequency.exponentialRampToValueAtTime(Math.max(60, o.f2), t + o.dur);
    bf.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.g, t + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    s.connect(bf); bf.connect(g); g.connect(o.dest || this.sfxBus);
    s.start(t, Math.random() * 1.5); s.stop(t + o.dur + 0.05);
  },

  update(dt, S) {
    if (!this.ok || this.ctx.state !== 'running') return;
    const spd = S ? S.speed : 0;
    const target = clamp((spd - 5.5) / 24, 0, 1);
    this.intensity += (target - this.intensity) * Math.min(1, dt * 1.4);
    const I = this.intensity;
    this.bpm = 84 + 70 * I;

    // live SFX beds
    if (S) {
      const wg = clamp((spd / 34) * (spd / 34), 0, 1) * 0.34 + (S.air ? 0.09 : 0);
      this.windGain.gain.setTargetAtTime(this.muted ? 0 : wg, this.ctx.currentTime, 0.09);
      this.windFilt.frequency.setTargetAtTime(360 + spd * 26, this.ctx.currentTime, 0.12);
      const ea = Math.abs(S.edge);
      const cg = S.air ? 0 : clamp(S.carveNoise, 0, 1) * 0.30;
      this.carveGain.gain.setTargetAtTime(this.muted ? 0 : cg, this.ctx.currentTime, 0.05);
      this.carveFilt.frequency.setTargetAtTime(900 + ea * 2600 + spd * 34, this.ctx.currentTime, 0.06);
      this.carveFilt.Q.setTargetAtTime(0.9 + ea * 3.4, this.ctx.currentTime, 0.1);
      const ch = S.air ? 0 : clamp(S.chatter, 0, 1) * 0.30;
      this.chatterGain.gain.setTargetAtTime(this.muted ? 0 : ch, this.ctx.currentTime, 0.05);
    }

    // 16th-note scheduler
    const now = this.ctx.currentTime;
    if (this.nextT < now - 0.4) this.nextT = now + 0.05;
    const stepDur = 60 / this.bpm / 4;
    let guard = 0;
    while (this.nextT < now + 0.16 && guard++ < 40) {
      this.schedule(this.step, this.nextT, I);
      this.nextT += stepDur;
      this.step = (this.step + 1) % 64;
    }
  },

  schedule(s, t, I) {
    if (this.muted || !this.prog) return;
    const bar = (s / 16) | 0, sub = s % 16;
    const ch = this.prog[bar % this.prog.length];
    const rt = this.root + ch[0], tones = ch[1];
    const F = AU.mtof;
    const lvl = (thr) => clamp((I - thr) / (1 - thr), 0, 1);

    // pad — the alpine bed, always present
    if (sub === 0) {
      const g = 0.052 + 0.05 * I;
      for (let i = 0; i < 3; i++) {
        this.voice({ type:'sawtooth', f:F(rt + 12 + tones[i]), t, dur:60/this.bpm*4.1, g,
          a:0.5, filt:520 + 1500 * I, filt2:340 + 900 * I, q:1.4, detune:(i - 1) * 9 });
      }
      this.voice({ type:'sine', f:F(rt - 12), t, dur:60/this.bpm*4.1, g:0.10 + 0.06*I, a:0.35 });
    }
    // bass
    const bp = [1,0,0,1, 0,0,1,0, 1,0,0,1, 0,1,0,0];
    if (bp[sub] && I > 0.04) {
      this.voice({ type:'sawtooth', f:F(rt), t, dur:0.30, g:0.14 + 0.09 * lvl(0.04),
        filt:220 + 620 * I, q:5.5 });
    }
    // hats
    if (sub % 2 === 0 && I > 0.24) {
      this.noiseHit({ t, f:8200, dur:sub % 4 === 0 ? 0.05 : 0.032, g:(0.028 + 0.03 * lvl(0.24)) * (sub % 4 === 0 ? 1.3 : 0.8),
        ftype:'highpass', q:0.8, dest:this.musicBus });
    }
    // kick
    if ((sub % 8 === 0 || (sub === 11 && bar % 2 === 1)) && I > 0.33) {
      this.voice({ type:'sine', f:118, f2:41, t, dur:0.32, g:0.36 * (0.5 + 0.5 * lvl(0.33)), a:0.003, slide:0.35 });
      this.noiseHit({ t, f:120, dur:0.03, g:0.07, ftype:'lowpass', dest:this.musicBus });
    }
    // clap
    if ((sub === 4 || sub === 12) && I > 0.48) {
      this.noiseHit({ t, f:1750, dur:0.15, g:0.10 * lvl(0.48), q:0.7, dest:this.musicBus });
    }
    // arpeggio
    if (I > 0.42) {
      const seq = [0,1,2,3,2,1,3,2];
      const n = tones[seq[s % seq.length] % tones.length] + (s % 8 < 4 ? 12 : 24);
      this.voice({ type:'square', f:F(rt + n), t, dur:0.16, g:0.055 * lvl(0.42),
        filt:900 + 5200 * I, q:7, send:0.34 });
    }
    // lead hook
    if (I > 0.66) {
      const mel = [null,null,0,null, 2,null,null,3, null,2,null,null, 4,null,3,null];
      const m = mel[sub];
      if (m !== null && m !== undefined && bar % 2 === 1) {
        this.voice({ type:'triangle', f:F(rt + 24 + tones[m % tones.length]), t, dur:0.42,
          g:0.10 * lvl(0.66), a:0.012, filt:5200, send:0.55 });
      }
    }
  },

  /* one-shots */
  land(v)   { if (!this.ok || this.muted) return; const t = this.ctx.currentTime;
              this.noiseHit({ t, f:900, f2:120, dur:0.26, g:clamp(v/17,0.08,0.5), q:0.7 });
              this.voice({ type:'sine', f:150, f2:48, t, dur:0.22, g:clamp(v/26,0.05,0.34), dest:this.sfxBus }); },
  pop()     { if (!this.ok || this.muted) return; const t = this.ctx.currentTime;
              this.noiseHit({ t, f:2600, f2:6200, dur:0.16, g:0.10, q:0.9 }); },
  hit()     { if (!this.ok || this.muted) return; const t = this.ctx.currentTime;
              this.noiseHit({ t, f:420, f2:90, dur:0.4, g:0.42, q:0.6 });
              this.voice({ type:'sine', f:90, f2:32, t, dur:0.5, g:0.34, dest:this.sfxBus }); },
  crash()   { if (!this.ok || this.muted) return; const t = this.ctx.currentTime;
              this.noiseHit({ t, f:1500, f2:70, dur:1.5, g:0.52, q:0.4 });
              this.voice({ type:'sawtooth', f:240, f2:26, t, dur:1.4, g:0.24, filt:900, filt2:110, dest:this.sfxBus });
              this.voice({ type:'sine', f:64, f2:24, t, dur:1.2, g:0.34, dest:this.sfxBus });
              if (this.musicBus) { this.musicBus.gain.cancelScheduledValues(t);
                this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, t);
                this.musicBus.gain.linearRampToValueAtTime(0.10, t + 0.5); } },
  revive()  { if (!this.ok) return; const t = this.ctx.currentTime;
              this.musicBus.gain.cancelScheduledValues(t);
              this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, t);
              this.musicBus.gain.linearRampToValueAtTime(0.62, t + 0.7); },
  swish(g)  { if (!this.ok || this.muted) return; const t = this.ctx.currentTime;
              this.noiseHit({ t, f:1600, f2:280, dur:0.35, g:g || 0.085, q:0.9 }); },
  chime(d)  { if (!this.ok || this.muted) return; const t = this.ctx.currentTime;
              const base = [76,74,69,67,65][clamp(d,0,4)];
              const iv = d >= 3 ? [0,3,7] : [0,4,7];
              for (let i = 0; i < 3; i++)
                this.voice({ type:'triangle', f:AU.mtof(base + iv[i]), t:t + i * 0.075, dur:0.75,
                  g:0.15, a:0.006, filt:5200, send:0.5 }); },
};

/* ================================================================ INPUT === */
const keys = Object.create(null);
const IN = { steer:0, effort:0, q:false, w:false, e:false, pop:false };
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if ([' ','arrowleft','arrowright','arrowup','arrowdown','q','w','e','r','p','escape'].includes(k)) ev.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  if (k === ' ')      GAME.space();
  if (k === 'r')      GAME.restart();
  if (k === 'p' || k === 'escape') GAME.togglePause();
  if (k === 'm')      { AU.muted = !AU.muted; if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.85; }
});
addEventListener('keyup', ev => { keys[ev.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function readInput() {
  const l = keys['arrowleft'] || keys['a'], r = keys['arrowright'] || keys['d'];
  IN.steer = (r ? 1 : 0) - (l ? 1 : 0);
  IN.q = !!keys['q']; IN.w = !!keys['w']; IN.e = !!keys['e'];
  IN.effort = (IN.q ? 1 : 0) + (IN.w ? 1 : 0) + (IN.e ? 1 : 0);
}

/* =============================================================== SKIER ==== */
const S = {
  x:0, y:0, z:0, vx:0, vy:0, vz:0,
  yaw:0,              // ski heading; 0 = straight down the fall line
  edge:0,             // signed edge engagement, -1..1
  steerS:0,           // smoothed steering input
  crouch:0,           // 0 tall .. 1 tuck
  speed:0, air:false, airT:0, airTotal:0, bestAir:0,
  onGround:true, risk:0, lat:0, skid:0, carveNoise:0, chatter:0, gForce:1,
  edgeAngle:0, tuck:false, offPiste:0, popCd:0, lastPop:0, stuckT:0,
  dist:0, drop:0, startY:0, maxSpeed:0, time:0, alive:true, maxDiff:0, passes:0,
};

function resetSkier() {
  ensureCourse(200);
  refreshKickers(0);
  S.z = 0; S.x = centerAt(0); S.y = terrainH(S.x, S.z);
  S.vx = 0; S.vy = 0; S.vz = 2.4;
  S.yaw = 0; S.edge = 0; S.steerS = 0; S.crouch = 0;
  S.speed = 2.4; S.air = false; S.airT = 0; S.airTotal = 0; S.bestAir = 0;
  S.onGround = true; S.risk = 0; S.lat = 0; S.skid = 0; S.carveNoise = 0; S.chatter = 0;
  S.gForce = 1; S.edgeAngle = 0; S.tuck = false; S.offPiste = 0; S.popCd = 0; S.stuckT = 0;
  S.dist = 0; S.drop = 0; S.startY = S.y; S.maxSpeed = 0; S.time = 0; S.alive = true; S.maxDiff = 0;
  S.passes = 0;
}

function stepPhysics(dt) {
  if (!S.alive) return;
  const eff = IN.effort;
  const steerIn = IN.steer;

  /* ---- stance ---- */
  const crouchTarget = eff / 3;
  S.crouch += (crouchTarget - S.crouch) * Math.min(1, dt * 9);
  S.tuck = (eff === 3 && steerIn === 0 && !S.air);

  /* ---- steering & edge set ---- */
  const rate = PHYS.EDGE_RATE[eff];
  S.steerS += (steerIn - S.steerS) * Math.min(1, dt * rate);
  if (Math.abs(steerIn) < 0.01) S.steerS *= Math.max(0, 1 - dt * (2.0 + eff * 1.6));
  S.edge = S.steerS;
  const phiMax = PHYS.EDGE_MAX[eff];
  S.edgeAngle = Math.abs(S.edge) * phiMax;

  const p = paramsAt(S.z);
  const hw = p.width, dxc = S.x - centerAt(S.z);
  S.offPiste = sstep(hw * 0.92, hw * 1.14, Math.abs(dxc));

  const gh = terrainH(S.x, S.z);
  const n = terrainN(S.x, S.z);
  const nx = n.x, ny = n.y, nz = n.z;

  /* ---- ground contact ---- */
  const wasAir = S.air;
  const above = S.y - gh;
  S.onGround = above <= 0.045;
  S.air = !S.onGround;

  if (S.onGround) {
    if (wasAir) {
      const impact = -(S.vx * nx + S.vy * ny + S.vz * nz);
      const cap = PHYS.ABSORB[eff];
      if (impact > cap) {
        if (impact > cap * 1.55) return crash('BLEW THE LANDING');
        S.risk += (impact - cap) / cap * 0.65;
      }
      if (impact > 1.6) {
        AU.land(impact);
        spray(Math.min(46, impact * 3.2), 1.5);
        cam.shake = Math.min(1.2, impact * 0.055);
      }
      if (S.airT > 0.28) { S.bestAir = Math.max(S.bestAir, S.airT); HUD.airPop(S.airT); }
      S.airTotal += S.airT;
      // scrub some speed on a heavy landing, less if the legs were loaded
      const scrub = clamp((impact - cap * 0.4) / 14, 0, 0.34) * (1 - eff * 0.16);
      S.vx *= 1 - scrub; S.vy *= 1 - scrub; S.vz *= 1 - scrub;
      S.airT = 0;
    }
    S.y = gh;
    // kill velocity into the surface
    const vn = S.vx * nx + S.vy * ny + S.vz * nz;
    if (vn < 0) { S.vx -= vn * nx; S.vy -= vn * ny; S.vz -= vn * nz; }
  } else {
    S.airT += dt;
  }

  /* ---- forces ---- */
  let ax = 0, ay = -PHYS.G, az = 0;

  if (S.onGround) {
    // gravity resolved into the slope plane
    const gdotn = -PHYS.G * ny;
    const gN = Math.abs(gdotn);                 // normal acceleration, ~g cos(theta)
    ax = -gdotn * nx; ay = -PHYS.G - gdotn * ny; az = -gdotn * nz;

    // ski frame: forward along the heading, projected onto the slope
    let fx = Math.sin(S.yaw), fy = 0, fz = Math.cos(S.yaw);
    const fd = fx * nx + fy * ny + fz * nz;
    fx -= fd * nx; fy -= fd * ny; fz -= fd * nz;
    const fl = Math.hypot(fx, fy, fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;
    // lateral = n x forward
    let lx = ny * fz - nz * fy, ly = nz * fx - nx * fz, lz = nx * fy - ny * fx;
    const ll = Math.hypot(lx, ly, lz) || 1;
    lx /= ll; ly /= ll; lz /= ll;

    const vf = S.vx * fx + S.vy * fy + S.vz * fz;
    const vl = S.vx * lx + S.vy * ly + S.vz * lz;
    S.lat = vl;
    const sp = Math.hypot(S.vx, S.vy, S.vz);

    /* -- edge grip: resist the sideways slide, up to what the edges hold -- */
    const engage = 0.16 + 0.84 * Math.abs(S.edge);
    const snowGrip = lerp(1, 0.62, S.offPiste);      // powder holds an edge poorly
    const gripMax = PHYS.GRIP[eff] * gN * engage * snowGrip;
    const need = Math.abs(vl) / Math.max(dt, 1e-4);
    const applied = Math.min(need, gripMax);
    const sgn = vl > 0 ? -1 : 1;
    ax += sgn * applied * lx; ay += sgn * applied * ly; az += sgn * applied * lz;

    S.skid = clamp(Math.abs(vl) / 5.5, 0, 1);

    /* -- skidding also drags the skis back: this is how you scrub speed -- */
    const skidDrag = (0.30 + 0.55 * Math.abs(S.edge)) * (0.4 + eff * 0.28) * gN
                     * clamp(Math.abs(vl) / 2.4, 0, 1.6);

    /* -- an edged ski held across the fall line ploughs snow. This is the
          actual brake: turn shape controls speed, and holding the turn past
          ~40° off the fall line is what brings you to a stop.             -- */
    const across = clamp((Math.abs(S.yaw) - 42 * DEG) / (45 * DEG), 0, 1);
    const brake = across * Math.abs(S.steerS) * (0.10 + 0.72 * (eff / 3))
                  * (0.30 + 0.70 * Math.abs(S.edge)) * gN * clamp(sp / 2.5, 0, 1);

    /* -- base friction + air drag -- */
    const mu = lerp(PHYS.MU_PISTE, PHYS.MU_POWDER, S.offPiste)
             + p.rough * 0.012 + p.mogul * 0.020;
    const cda = S.tuck ? PHYS.CDA_TUCK : PHYS.CDA[eff];
    const drag = 0.5 * PHYS.RHO * cda * sp * sp / PHYS.M;
    const resist = mu * gN + skidDrag + brake + drag;
    if (sp > 0.02) {
      const rx = S.vx / sp, ry = S.vy / sp, rz = S.vz / sp;
      const dv = Math.min(resist, sp / Math.max(dt, 1e-4));
      ax -= rx * dv; ay -= ry * dv; az -= rz * dv;
    }

    /* -- yaw: carving radius from the sidecut, plus skidded pivot -- */
    const phi = S.edgeAngle;
    const R = Math.max(3.0, PHYS.R_SIDECUT * Math.cos(phi));
    const wCarve = (Math.abs(vf) / R) * Math.abs(S.edge) * (0.35 + 0.65 * (eff / 3));
    // Pivot authority never drops to zero: stopped and sideways across the
    // hill you must still be able to step the skis back to the fall line.
    const wPivot = PHYS.PIVOT[eff] * Math.abs(S.edge) * clamp(0.30 + sp / 5.5, 0, 1);
    S.yaw += Math.sign(S.edge) * (wCarve + wPivot) * dt;
    // Flat skis can't hold a traverse — gravity washes the tails downhill and
    // points you back down the fall line. Also true at a standstill.
    if (Math.abs(S.edge) < 0.06)
      S.yaw -= S.yaw * dt * (0.55 - eff * 0.11) * clamp(0.35 + sp / 8, 0, 1);
    S.yaw = clamp(S.yaw, -102 * DEG, 102 * DEG);

    S.gForce = Math.hypot(applied, gN) / PHYS.G;
    S.carveNoise = clamp((0.25 + Math.abs(S.edge) * 0.9) * (sp / 20) + S.skid * 0.75
                         + across * Math.abs(S.steerS) * clamp(sp / 9, 0, 1) * 0.8, 0, 1.3);
    S.chatter = clamp((p.mogul * 0.7 + p.rough * 0.35 + S.offPiste * 0.5) * (sp / 18), 0, 1);

    /* -- spray from the edges -- */
    if (sp > 3 && (S.skid > 0.06 || Math.abs(S.edge) > 0.3 || across > 0.15))
      spray((S.skid * 26 + Math.abs(S.edge) * 7 + across * Math.abs(S.steerS) * 20)
            * dt * 60 * 0.35, 0.55 + S.skid + across * 0.5);

    /* -- balance erosion -- */
    // A tuck is stable but it is not a licence to straight-line: you are on
    // flat skis with no edge, so rough snow and narrow trails punish it.
    const comfort = (S.tuck ? 28.5 : PHYS.COMFORT[eff]) * lerp(1, 0.66, S.offPiste);
    let load = 0;
    if (sp > comfort) load += (sp - comfort) / comfort * 1.5;
    const rough = p.mogul * 0.95 + p.rough * 0.55 + S.offPiste * 1.25;
    load += rough * clamp((sp - comfort * 0.45) / comfort, 0, 2) * (S.tuck ? 1.75 : 1.15);
    load += clamp(Math.abs(vl) / (2.6 + eff * 3.4) - 0.55, 0, 2) * 0.85;
    if (need > gripMax * 1.05 && sp > 12) load += 0.35;        // edges washing out
    S.risk += (load - (0.42 + eff * 0.40)) * dt;
    S.risk = clamp(S.risk, 0, 1.05);
    if (S.risk >= 1) return crash(S.offPiste > 0.5 ? 'BURIED THE TIPS' : 'CAUGHT AN EDGE');

    /* -- poling out of a flat spot --
       Terrain built from additive features can always produce a local pocket
       that is flat or slightly uphill. A real skier just poles or skates out,
       so do that: only when genuinely stopped and NOT holding an edge, which
       keeps a deliberate hockey-stop parked on the hill exactly as before. */
    // A genuine flat spot is detectable: gravity along the surface goes to
    // nothing. Escape from one regardless of steering — otherwise a player
    // holding a direction to get out is exactly who stays trapped. On a real
    // slope, stopped means you're holding an edge, so leave them parked.
    const gTan = PHYS.G * Math.sqrt(Math.max(0, 1 - ny * ny));
    if (sp < 1.1 && (Math.abs(steerIn) < 0.01 || gTan < 1.7)) S.stuckT += dt;
    else S.stuckT = 0;
    if (S.stuckT > 1.0) {
      const toC = centerAt(S.z) - S.x;
      S.vz += 2.8 * dt;
      S.vx += clamp(toC * 0.25, -1.6, 1.6) * dt;
    }

    /* -- pop / unweight -- */
    S.popCd = Math.max(0, S.popCd - dt);
    if (IN.pop && S.popCd <= 0) {
      const v = PHYS.POP[eff];
      S.vx += nx * v; S.vy += ny * v; S.vz += nz * v;
      S.y += 0.06; S.popCd = 0.35; AU.pop(); IN.pop = false;
    }
  } else {
    IN.pop = false;
    // in the air: gravity + drag only, and you can steer the skis a little
    const sp = Math.hypot(S.vx, S.vy, S.vz);
    const cda = S.tuck || eff === 3 ? PHYS.CDA_TUCK * 1.25 : PHYS.CDA[eff];
    const drag = 0.5 * PHYS.RHO * cda * sp * sp / PHYS.M;
    if (sp > 0.02) { ax -= S.vx / sp * drag; ay -= S.vy / sp * drag; az -= S.vz / sp * drag; }
    S.yaw += S.steerS * (0.7 + eff * 0.25) * dt;
    S.yaw = clamp(S.yaw, -102 * DEG, 102 * DEG);
    S.skid *= Math.max(0, 1 - dt * 3);
    S.carveNoise *= Math.max(0, 1 - dt * 5);
    S.chatter = 0;
    S.gForce = 0;
    S.risk = Math.max(0, S.risk - dt * 0.16);
  }

  S.vx += ax * dt; S.vy += ay * dt; S.vz += az * dt;
  S.x += S.vx * dt; S.y += S.vy * dt; S.z += S.vz * dt;

  S.speed = Math.hypot(S.vx, S.vy, S.vz);
  S.maxSpeed = Math.max(S.maxSpeed, S.speed);
  S.dist = Math.max(S.dist, S.z);
  S.drop = S.startY - S.y;
  S.maxDiff = Math.max(S.maxDiff, p.diff);
  S.time += dt;

  checkCollisions();
  if (S.alive) checkNpcCollisions();
}

function crash(reason) {
  if (!S.alive) return;
  S.alive = false;
  GAME.crashReason = reason;
  GAME.state = 'crash';
  GAME.crashT = 0;
  GAME.timeScale = 0.32;
  AU.crash();
  buildRagdoll();
  spray(120, 3.2);
  cam.shake = 1.6;
  cam.crashSide = Math.random() < 0.5 ? -1 : 1;
  cam.crashYaw = cam.yaw + cam.crashSide * 1.15;   // swing wide, past whatever you hit
}

/* ---------------------------------------------------------- collisions --- */
function checkCollisions() {
  const c0 = Math.floor((S.z - 6) / CHUNK), c1 = Math.floor((S.z + 8) / CHUNK);
  for (let ci = c0; ci <= c1; ci++) {
    const list = chunkAt(ci);
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      const dz = o.z - S.z;
      if (dz < -2.2 || dz > 2.2) continue;
      const dx = o.x - S.x;
      let rad = 0, kind = 0;   // 0 = soft, 1 = hard
      switch (o.t) {
        case OBJ.TREE:   rad = 0.42 + o.h * 0.032; kind = 1; break;
        case OBJ.ROCK:   rad = o.r * 0.85; kind = o.r > 0.9 ? 1 : 0; break;
        case OBJ.TOWER:  rad = 1.05; kind = 1; break;
        case OBJ.GUN:    rad = 0.55; kind = 1; break;
        case OBJ.NET:    rad = 0.55; kind = 1; break;
        case OBJ.HAY:    rad = 0.75; kind = 0; break;
        case OBJ.POLE:   rad = 0.20; kind = 0; break;
        case OBJ.SIGN:   rad = 0.30; kind = 1; break;
        default: continue;
      }
      if (Math.abs(dx) > rad + 0.5) continue;
      if (S.y - o.y > (o.t === OBJ.POLE ? 1.4 : o.t === OBJ.ROCK ? o.r * 1.5 + 0.4 : 3.0)) continue; // cleared it
      if (Math.hypot(dx, dz) > rad + 0.42) continue;

      if (kind === 1) return crash(o.t === OBJ.TREE ? 'MET A TREE'
                                : o.t === OBJ.TOWER ? 'HIT A LIFT TOWER'
                                : o.t === OBJ.NET ? 'INTO THE B-NET'
                                : o.t === OBJ.SIGN ? 'TOOK OUT A SIGN' : 'HIT A ROCK');
      // soft: a smack, some speed, some balance
      const f = o.t === OBJ.POLE ? 0.09 : 0.26;
      S.vx *= 1 - f; S.vy *= 1 - f; S.vz *= 1 - f;
      S.risk = clamp(S.risk + (o.t === OBJ.POLE ? 0.10 : 0.30), 0, 1.05);
      cam.shake = Math.max(cam.shake, o.t === OBJ.POLE ? 0.30 : 0.7);
      AU.hit(); spray(o.t === OBJ.POLE ? 12 : 34, 1.4);
      o.z = -1e9;   // knocked out of the way
    }
  }
}

/* ============================================================= RAGDOLL ==== */
let ragdoll = null;
function buildRagdoll() {
  const parts = [];
  const mk = (type, ox, oy, oz, vs, spin) => parts.push({
    type, x:S.x + ox, y:S.y + oy, z:S.z + oz,
    vx:S.vx * vs + rnd(-3.2, 3.2), vy:S.vy * vs + rnd(1.4, 6.2), vz:S.vz * vs + rnd(-2.6, 2.6),
    a:S.yaw, av:rnd(-spin, spin), roll:0, rv:rnd(-spin, spin), rest:false, life:0,
  });
  mk('body', 0, 0.85, 0, 0.92, 7);
  mk('ski', -0.2, 0.05, 0.2, 1.06, 15);
  mk('ski',  0.2, 0.05,-0.1, 1.10, 15);
  mk('pole',-0.5, 0.7, -0.1, 1.15, 20);
  mk('pole', 0.5, 0.7,  0.1, 1.15, 20);
  mk('hat',  0,   1.65, 0,   1.0,  22);
  ragdoll = parts;
}
function stepRagdoll(dt) {
  if (!ragdoll) return;
  for (const p of ragdoll) {
    p.life += dt;
    if (p.rest) continue;
    p.vy -= PHYS.G * dt;
    const sp = Math.hypot(p.vx, p.vy, p.vz);
    const d = 0.5 * PHYS.RHO * (p.type === 'ski' ? 0.16 : 0.5) * sp * sp / (p.type === 'body' ? 78 : 4);
    if (sp > 0.01) { p.vx -= p.vx / sp * d * dt; p.vy -= p.vy / sp * d * dt; p.vz -= p.vz / sp * d * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.a += p.av * dt; p.roll += p.rv * dt;
    const gh = terrainH(p.x, p.z);
    if (p.y < gh) {
      p.y = gh;
      const n = terrainN(p.x, p.z);
      const vn = p.vx * n.x + p.vy * n.y + p.vz * n.z;
      if (vn < 0) {
        const e = p.type === 'body' ? 0.20 : 0.34;
        p.vx -= (1 + e) * vn * n.x; p.vy -= (1 + e) * vn * n.y; p.vz -= (1 + e) * vn * n.z;
        if (Math.abs(vn) > 2.4) { spray(10, 1.1); AU.land(Math.abs(vn) * 0.6); }
      }
      const f = Math.max(0, 1 - dt * (p.type === 'ski' ? 1.6 : 4.4));
      p.vx *= f; p.vz *= f; p.av *= f; p.rv *= f;
      if (Math.hypot(p.vx, p.vy, p.vz) < 0.55) { p.rest = true; p.vx = p.vy = p.vz = 0; p.av = p.rv = 0; }
    }
  }
}

/* ================================================================ NPCS ====
   Other skiers sharing the mountain. Traffic builds the further into the
   day you get — and thins right out on the steeps, because most people
   simply never point their skis down a black. Each one holds their own
   rhythm down the piste; contact is a crash for everyone involved. */
const NPCS = [];
const NPC_MAX = 14;
const NPC_BY_DIFF = [1.0, 0.92, 0.58, 0.20, 0.07];   // green .. double black
const NPC_JACKETS = [
  ['#dc2626','#7f1d1d'], ['#ea580c','#7c2d12'], ['#eab308','#713f12'],
  ['#16a34a','#14532d'], ['#7c3aed','#3b0764'], ['#db2777','#831843'],
  ['#f8fafc','#475569'], ['#1d4ed8','#172554'], ['#0d9488','#134e4a'],
];
const NPC_HELMETS = ['#e2e8f0', '#0f172a', '#dc2626', '#facc15'];
const NPC_SKIS = ['#e11d48', '#f59e0b', '#0ea5e9', '#10b981', '#f472b6', '#a3e635'];

/* how crowded the hill is at z: builds with distance covered, then falls
   away with difficulty — greens and blues carry the traffic, blacks are
   close to empty, double blacks deserted */
function npcDensity(z) {
  const build = 0.30 + 0.70 * sstep(120, 2400, z);
  return build * NPC_BY_DIFF[paramsAt(z).diff];
}

let npcSpawnT = 0;
function spawnNpcAt(z) {
  const p = paramsAt(z);
  const skill = Math.pow(Math.random(), 0.65);        // most are middling
  const jacket = pick(NPC_JACKETS);
  const n = {
    z, x: centerAt(z) + rnd(-0.72, 0.72) * p.width,
    y: 0, yaw: 0, vz: lerp(4.2, 11.5, skill), vxAct: 0, airV: 0,
    skill,
    cruise: lerp(4.6, 13.2, skill) * rnd(0.92, 1.1),
    amp: clamp(rnd(0.25, 0.55) + (1 - skill) * 0.15, 0.2, 0.7),
    freq: rnd(0.045, 0.085) * lerp(1.25, 0.8, skill),
    phase: rnd(0, TAU),
    lean: 0, stanceH: lerp(0.88, 0.60, skill),
    c1: hex2rgb(jacket[0]), c2: hex2rgb(jacket[1]),
    helm: hex2rgb(pick(NPC_HELMETS)), skiC: hex2rgb(pick(NPC_SKIS)),
    downed: false, downT: 0, getUp: 0, hitVx: 0, hitVz: 0, coolT: 0,
    relPrev: z - S.z, sprA: rnd(-0.5, 0.5), warned: false,
  };
  if (z < S.z)                                        // spawned uphill: they're coming through
    n.cruise = clamp(Math.max(n.cruise, S.speed + rnd(1.5, 4.0)), 5, 16.5);
  n.vz = Math.min(n.vz, n.cruise);
  n.y = terrainH(n.x, n.z);
  NPCS.push(n);
}

function knockDownNpc(n, vx, vz, loud) {
  if (n.downed) return;
  n.downed = true; n.downT = 0; n.getUp = rnd(3.2, 6.0);
  n.hitVx = vx * 0.45; n.hitVz = Math.max(0, vz) * 0.45;
  n.coolT = 1.0;
  if (loud) { AU.hit(); spray(30, 1.8); cam.shake = Math.max(cam.shake, 0.8); }
}

function stepNpcs(dt) {
  // population control: try one spawn per tick, gated by how busy the hill
  // should be at the spawn point itself — so an empty black stays empty even
  // while you're still finishing the blue above it
  npcSpawnT -= dt;
  if (npcSpawnT <= 0) {
    npcSpawnT = 0.28;
    // no spawning during the wipeout — the crash camera swings far enough
    // round that a behind-spawn would materialise in full view
    if (GAME.state !== 'crash') {
      const behind = S.speed < 8.5 && Math.random() < 0.25; // overtakers only make sense when you're slow
      const z = behind ? S.z - rnd(38, 55) : S.z + rnd(235, 305);
      if (z > 20 && z < COURSE.nextZ - 80 && NPCS.length < Math.round(NPC_MAX * npcDensity(z)))
        spawnNpcAt(z);
    }
  }

  for (let i = NPCS.length - 1; i >= 0; i--) {
    const n = NPCS[i];
    if (n.z < S.z - 80 || n.z > S.z + 340) { NPCS.splice(i, 1); continue; }
    n.coolT = Math.max(0, n.coolT - dt);

    if (n.downed) {
      n.downT += dt;
      const k = Math.max(0, 1 - dt * 2.2);
      n.hitVx *= k; n.hitVz *= k;
      n.x += n.hitVx * dt; n.z += n.hitVz * dt;
      n.y = terrainH(n.x, n.z);
      n.relPrev = n.z - S.z;      // keep the crossing bookkeeping live, else a
                                  // stand-up 40 m uphill fires a phantom swish
      if (n.downT > n.getUp) { n.downed = false; n.vz = Math.max(2, n.cruise * 0.35); n.coolT = 0.5; }
      continue;
    }

    const p = paramsAt(n.z);
    const hw = p.width, cx = centerAt(n.z);
    const dzP = S.z - n.z;        // +ve: the player is downhill of this skier

    // everyone checks their speed on steep ground — the good ones less so
    const steep = clamp((p.slope - 12 * DEG) / (26 * DEG), 0, 1);
    const want = n.cruise * lerp(1, lerp(0.5, 1.05, n.skill), steep);
    n.vz += (want - n.vz) * Math.min(1, dt * 0.7);
    // closing on somebody's back, a skier checks their speed to match — how
    // reliably depends entirely on how good they are, so the beginners are
    // still the ones who hit you from behind
    if (S.alive && GAME.state === 'run' && dzP > 0 && dzP < 12 && Math.abs(S.x - n.x) < 3.2) {
      const cap = S.speed + 1.5;
      if (n.vz > cap) n.vz += (cap - n.vz) * Math.min(1, dt * (0.8 + 2.6 * n.skill));
      // a whoosh of warning when someone's coming through hot
      if (!n.warned && n.vz > S.vz + 2) { n.warned = true; AU.swish(0.05); }
    }
    if (dzP > 18 || dzP < -2) n.warned = false;

    // their line: a personal rhythm around the centreline...
    let tx = cx + Math.sin(n.z * n.freq + n.phase) * n.amp * hw;
    // ...bent to give the downhill skier space. The uphill skier is the one
    // responsible for avoiding — and only the good ones actually manage it.
    // The window runs through the pass itself (down to -4) so the clearance
    // isn't released while they're still alongside you.
    if (S.alive && GAME.state === 'run') {
      if (dzP > -4 && dzP < 26) {
        const room = 2.8 - Math.abs(S.x - tx);
        if (room > 0) tx -= Math.sign(S.x - tx || 1) * room * lerp(0.25, 1.0, n.skill);
      }
    }
    const maxLat = n.vz * 0.55 + 0.5;
    n.vxAct = clamp((tx - n.x) * 3.0, -maxLat, maxLat);
    n.x += n.vxAct * dt;
    n.z += n.vz * dt;

    // stick to the snow, with just enough give to catch air off a roller
    const gh = terrainH(n.x, n.z);
    if (gh >= n.y) { n.y = gh; n.airV = 0; }
    else { n.airV += PHYS.G * dt; n.y = Math.max(gh, n.y - n.airV * dt); }

    const wantLean = clamp(n.vxAct / (n.vz + 1), -1, 1) * 0.55;
    n.lean += (wantLean - n.lean) * Math.min(1, dt * 5);
    n.yaw += (Math.atan2(n.vxAct, Math.max(n.vz, 0.5)) - n.yaw) * Math.min(1, dt * 6);

    // weak skiers fall over on their own out on the hard stuff
    const hazard = (p.mogul * 0.9 + steep * 0.8) * (1 - n.skill);
    if (hazard > 0.02 && Math.random() < dt * hazard * 0.045)
      knockDownNpc(n, n.vxAct * 0.5, n.vz * 0.5, false);

    // passing tally + the whoosh of close traffic. The |rel| bound keeps a
    // deferred detection (despawn edge cases) from whooshing at a distance.
    const rel = n.z - S.z;
    if (GAME.state === 'run' && S.alive && Math.abs(rel) < 8) {
      if (n.relPrev > 0 && rel <= 0) { S.passes++; if (Math.abs(n.x - S.x) < 6) AU.swish(); }
      else if (n.relPrev < 0 && rel >= 0 && Math.abs(n.x - S.x) < 6) AU.swish();
    }
    n.relPrev = rel;
  }
}

/* contact with another skier: they go down every time; whether you join
   them depends on how hard you met */
function checkNpcCollisions() {
  for (let i = 0; i < NPCS.length; i++) {
    const n = NPCS[i];
    if (n.coolT > 0) continue;
    const dz = n.z - S.z; if (dz < -1.6 || dz > 1.6) continue;
    const dx = n.x - S.x; if (dx < -1.3 || dx > 1.3) continue;
    // clean vertical miss either way: you pop over them, or they fly over you
    const dy = S.y - n.y;
    if (dy > (n.downed ? 0.85 : 1.9) || dy < -2.0) continue;
    if (Math.hypot(dx, dz) > (n.downed ? 1.0 : 0.85)) continue;

    if (n.downed) {
      if (S.speed > 3.6) return crash('TRIPPED OVER A DOWNED SKIER');
      S.vx *= 0.72; S.vz *= 0.72;
      S.risk = clamp(S.risk + 0.34, 0, 1.05);
      n.coolT = 1.0;
      AU.hit(); cam.shake = Math.max(cam.shake, 0.5);
      continue;
    }

    const rel = Math.hypot(S.vx - n.vxAct, S.vz - n.vz);
    knockDownNpc(n, S.vx, S.vz, true);
    if (rel > 4.3)
      return crash(dz < 0 ? 'TAKEN OUT FROM BEHIND' : 'TOOK OUT ANOTHER SKIER');
    // glancing contact: they're down, you wobble away with a warning
    S.vx *= 0.78; S.vz *= 0.78;
    S.vx -= Math.sign(dx || 1) * 1.3;
    S.risk = clamp(S.risk + 0.38, 0, 1.05);
    cam.shake = Math.max(cam.shake, 0.6);
  }
}

/* =========================================================== PARTICLES ==== */
const PARTS = [];
function spray(n, power) {
  n = Math.min(n | 0, 90);
  for (let i = 0; i < n; i++) {
    if (PARTS.length > 320) break;
    const side = Math.random() < 0.5 ? -1 : 1;
    const a = S.yaw + side * (0.6 + Math.random() * 1.1);
    const sp = power * rnd(1.4, 5.2);
    PARTS.push({
      x:S.x + Math.sin(S.yaw) * rnd(-0.9, 0.9) + side * 0.22,
      y:S.y + rnd(0.02, 0.24),
      z:S.z + Math.cos(S.yaw) * rnd(-0.9, 0.9),
      vx:S.vx * 0.22 + Math.sin(a) * sp, vy:rnd(0.8, 3.4) * power, vz:S.vz * 0.22 + Math.cos(a) * sp * 0.5,
      life:0, max:rnd(0.45, 1.25), r:rnd(0.05, 0.17) * (0.75 + power * 0.20),
    });
  }
}
function stepParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i];
    p.life += dt;
    if (p.life > p.max) { PARTS.splice(i, 1); continue; }
    p.vy -= 8.4 * dt;
    p.vx *= 1 - dt * 2.1; p.vz *= 1 - dt * 2.1;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.r = Math.min(p.r + dt * 0.26, 0.55);
  }
}
/* falling snow, camera-local */
const SNOW = [];
for (let i = 0; i < 165; i++)
  SNOW.push({ x:rnd(-45, 45), y:rnd(0, 34), z:rnd(2, 110), vx:rnd(-1.4, 1.4), vy:rnd(-1.2, -3.2), r:rnd(0.02, 0.075) });

/* ============================================================== CAMERA ==== */
const cam = { x:0, y:0, z:0, yaw:0, pitch:0.35, f:600, shake:0, fovBoost:0, dist:8.4, height:2.75,
              crashYaw:0, crashSide:1 };

function updateCamera(dt) {
  // during a wipeout the camera follows the body, not the (frozen) skier
  const crashing = !!ragdoll;
  const T = crashing ? ragdoll[0] : S;
  const spdN = clamp(S.speed / 34, 0, 1.35);

  const wantDist = crashing ? 13.5 : 7.2 + spdN * 2.8 - S.crouch * 0.7;
  const wantH    = crashing ? 5.4  : 3.15 + spdN * 0.75 - S.crouch * 0.45;
  const follow   = crashing ? 2.0 : 2.6;
  cam.dist += (wantDist - cam.dist) * Math.min(1, dt * follow);
  cam.height += (wantH - cam.height) * Math.min(1, dt * follow);

  // swing round to the side for the wipeout: keeps whatever you hit out of
  // the way and shows the tumble properly
  if (crashing) cam.crashYaw += dt * 0.30 * cam.crashSide;
  const wantYaw = crashing ? cam.crashYaw : clamp(S.yaw * 0.30 + S.steerS * 0.10, -0.28, 0.28);
  cam.yaw += (wantYaw - cam.yaw) * Math.min(1, dt * (crashing ? 1.6 : 3.4));

  const tz = T.z - cam.dist * Math.cos(cam.yaw);
  const tx = T.x - cam.dist * Math.sin(cam.yaw);
  const groundY = terrainH(tx, tz);
  const ty = Math.max(groundY + cam.height * 0.6, lerp(T.y, groundY, 0.4) + cam.height);

  const k = Math.min(1, dt * (crashing ? 3.2 : 7.5));
  cam.x += (tx - cam.x) * k; cam.z += (tz - cam.z) * k;
  cam.y += (ty - cam.y) * Math.min(1, dt * (crashing ? 2.8 : 5.2));

  /* Pitch is solved, not guessed: pick the angle that puts the subject at a
     fixed height on screen. Works on a 9° green and a 45° couloir alike. */
  const frameY = lerp(T.y, terrainH(T.x, T.z), 0.45) + 0.85;
  const dy = frameY - cam.y;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const B = (T.x - cam.x) * sy + (T.z - cam.z) * cy;
  let wantPitch = cam.pitch;
  if (B > 1.5) {
    const kk = (cyp - H * (crashing ? 0.58 : 0.655)) / focal;
    wantPitch = clamp(Math.atan2(kk * B - dy, kk * dy + B), 0.06, 1.00);
  }
  cam.pitch += clamp((wantPitch - cam.pitch) * Math.min(1, dt * 5), -dt * 1.4, dt * 1.4);

  cam.fovBoost += ((crashing ? 0 : spdN * 0.13 + (S.tuck ? 0.05 : 0)) - cam.fovBoost) * Math.min(1, dt * 2.4);
  cam.shake = Math.max(0, cam.shake - dt * 2.6);
}

/* ============================================================= RENDERER === */
const cnv = document.getElementById('c');
const ctx = cnv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1, cxp = 0, cyp = 0, focal = 600;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.6);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  cnv.width = W; cnv.height = H;
  cxp = W / 2; cyp = H / 2;
}
addEventListener('resize', resize);

let shakeX = 0, shakeY = 0;
const PR = { x:0, y:0, d:0, s:0, ok:false };
function project(px, py, pz) {
  const dx = px - cam.x, dy = py - cam.y, dz = pz - cam.z;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const rx = dx * cy - dz * sy;
  const rz = dx * sy + dz * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const up = dy * cp + rz * sp;
  const depth = -dy * sp + rz * cp;
  if (depth < 0.35) { PR.ok = false; return PR; }
  PR.d = depth;
  PR.s = focal / depth;
  PR.x = cxp + rx * PR.s + shakeX;
  PR.y = cyp - up * PR.s + shakeY;
  PR.ok = true;
  return PR;
}

/* --- palette --- */
const SKY_TOP = [18, 46, 96], SKY_MID = [86, 150, 220], SKY_LOW = [186, 218, 246];
const FOG = [198, 220, 242];
const SNOW_LIT = [255, 252, 245], SNOW_SHADE = [116, 150, 202];
// Sun sits well above the steepest piste (~55°). If it sat at slope angle the
// lambert term would be stationary there and moguls on a black would vanish.
const SUN = (() => { const v = { x:-0.50, y:0.819, z:0.28 }; const l = Math.hypot(v.x, v.y, v.z); return { x:v.x/l, y:v.y/l, z:v.z/l }; })();

function fogMix(r, g, b, t) {
  return 'rgb(' + ((r + (FOG[0] - r) * t) | 0) + ',' + ((g + (FOG[1] - g) * t) | 0) + ',' + ((b + (FOG[2] - b) * t) | 0) + ')';
}

function drawSky() {
  const horizon = cyp - focal * Math.tan(cam.pitch);

  const g = ctx.createLinearGradient(0, 0, 0, Math.max(H * 0.4, horizon + H * 0.06));
  g.addColorStop(0,    `rgb(${SKY_TOP[0]},${SKY_TOP[1]},${SKY_TOP[2]})`);
  g.addColorStop(0.55, `rgb(${SKY_MID[0]},${SKY_MID[1]},${SKY_MID[2]})`);
  g.addColorStop(1,    `rgb(${SKY_LOW[0]},${SKY_LOW[1]},${SKY_LOW[2]})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // sun — up and to the left, tracking the camera yaw
  const sx = cxp - W * 0.29 + cam.yaw * W * 0.95;
  const sy = Math.max(H * 0.05, horizon - H * 0.30);
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.44);
  sg.addColorStop(0,    'rgba(255,252,238,.95)');
  sg.addColorStop(0.05, 'rgba(255,248,226,.62)');
  sg.addColorStop(0.20, 'rgba(255,242,208,.24)');
  sg.addColorStop(1,    'rgba(255,238,196,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);

  drawRidges(horizon);

  // hazy valley below the horizon, so the distant terrain fades into something
  const vg = ctx.createLinearGradient(0, horizon - H * 0.015, 0, Math.min(H, horizon + H * 0.42));
  vg.addColorStop(0,    `rgba(${FOG[0]},${FOG[1]},${FOG[2]},.28)`);
  vg.addColorStop(0.11, `rgba(${FOG[0]},${FOG[1]},${FOG[2]},1)`);
  vg.addColorStop(1,    `rgba(${FOG[0]},${FOG[1]},${FOG[2]},1)`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, horizon - H * 0.015, W, H - horizon + H * 0.015);
  return horizon;
}

function drawRidges(horizon) {
  const layers = [
    { amp:0.150, off:0.004, par:0.018, col:'rgba(84,120,172,.62)',  seed:3.1,  freq:0.0013 },
    { amp:0.105, off:0.030, par:0.034, col:'rgba(118,155,203,.70)', seed:17.3, freq:0.0024 },
    { amp:0.068, off:0.056, par:0.058, col:'rgba(158,190,226,.78)', seed:41.7, freq:0.0044 },
  ];
  for (const L of layers) {
    ctx.beginPath();
    const base = horizon + H * L.off;
    ctx.moveTo(-4, H + 4);
    const px = cam.x * L.par + cam.z * L.par * 0.25 - cam.yaw * W * L.par * 9;
    for (let i = -4; i <= W + 4; i += 7) {
      const t = (i + px * DPR) * L.freq;
      const h = (fbm(t, L.seed, 4) - 0.5) * 2;
      const h2 = (fbm(t * 2.6 + 5, L.seed + 9, 3) - 0.5) * 0.7;
      ctx.lineTo(i, base - (h + h2) * H * L.amp - H * L.amp * 0.55);
    }
    ctx.lineTo(W + 4, H + 4); ctx.closePath();
    ctx.fillStyle = L.col; ctx.fill();
  }
}

/* --- terrain grid --- */
// terrain tessellation — auto-scales at runtime to hold frame rate
let ROWS = 34, COLS = 34;
const gxA = new Float32Array(64 * 66), gyA = new Float32Array(64 * 66);
const gwx = new Float32Array(64 * 66), gwy = new Float32Array(64 * 66), gwz = new Float32Array(64 * 66);
const gsh = new Float32Array(64 * 66), gok = new Uint8Array(64 * 66), gdp = new Float32Array(64 * 66);

const NEAR_Z = 2.6, FAR_Z = 235;
function rowDepth(t) { return 1 / ((1 - t) / NEAR_Z + t / FAR_Z); }

/* The sampling grid is aligned to the camera, not to world Z, so it stays
   correct at any yaw (the wipeout camera swings a long way round). Rows are
   spaced harmonically in 1/depth, which makes every row the same height on
   screen. camDepth() is the painter's-algorithm sort key for everything. */
let fwdX = 0, fwdZ = 1, rgtX = 1, rgtZ = 0;
function updateCamBasis() {
  fwdX = Math.sin(cam.yaw); fwdZ = Math.cos(cam.yaw);
  rgtX = fwdZ;             rgtZ = -fwdX;
}
function camDepth(x, z) { return (x - cam.x) * fwdX + (z - cam.z) * fwdZ; }

function shadeSnow(x, z, nx, ny, nz, onPiste, depth, groomed) {
  const l = nx * SUN.x + ny * SUN.y + nz * SUN.z;
  let v = 0.10 + 1.0 * l;                  // key light off the sun
  v = v * 0.85 + 0.15 * (0.5 + 0.5 * ny);  // sky bounce, so shadows never go black
  // Snow only ever occupies the top of the lambert range, so stretch that
  // window — without it a whole mogul field reads as one flat white sheet.
  v = clamp((v - 0.52) / 0.46, 0, 1);

  // Corduroy is NOT done here — machine grooves are ~10 cm apart and no vertex
  // grid can resolve that, which is why shading it as a ripple only ever read
  // as vague fabric banding. It is drawn as real geometry in drawCorduroy().
  const off = 1 - onPiste;
  if (off > 0.02) {
    // untracked snow sits deeper and duller than a freshly tilled surface
    v -= off * 0.10;
    // Drift mottling, done in shading rather than height. Geometry this size
    // would out-run the fall line and re-create the uphill pockets; as pure
    // shading it costs nothing physically and, unlike real relief, it survives
    // the distance low-pass that smooths the normals away.
    v += (fbm(x * 0.09, z * 0.09, 2) - 0.5) * 0.22 * off * (1 - sstep(50, 95, depth));
    // crystal sparkle up close — this is what says "nobody has skied this"
    if (depth < 45) {
      v += (vnoise(x * 2.7, z * 2.7) - 0.5) * 0.17 * off * (1 - sstep(24, 45, depth));
    }
  }
  // the cut edge of the piste reads as a faint seam where tilled meets natural
  if (depth < 55) v -= (1 - Math.abs(onPiste - 0.5) * 2) * 0.055 * (1 - sstep(32, 55, depth));

  return clamp(v, 0, 1);
}

/* ---------------------------------------------------------- corduroy -----
   Real grooves, drawn as lines that follow the piste centreline and lie on
   the terrain, so they converge to the vanishing point and bend with the
   trail exactly as machine tracks do.

   Spacing is a power-of-two mip off a fixed 0.14 m lattice, so a groove
   visible in a far band is still there in the near band — no swimming. Drawn
   per depth slab, interleaved with the terrain rows, so a roller in front
   correctly hides the grooves behind it.                                    */
const CORD_FAR = 30, CORD_SLABS = 9, CORD_BASE = 0.14;
const CORD_D = new Float32Array(CORD_SLABS + 1);
for (let i = 0; i <= CORD_SLABS; i++) {
  const t = i / CORD_SLABS;
  CORD_D[i] = 1 / ((1 - t) / NEAR_Z + t / CORD_FAR);
}
let camTanH = 1;

function drawCorduroy(k) {
  const dN = CORD_D[k], dF = CORD_D[k + 1];
  const zN = cam.z + dN, zF = cam.z + dF;

  const pN = paramsAt(zN), hwN = pN.width;
  const groom = clamp(1 - pN.mogul * 2.4, 0, 1);      // mogul fields aren't groomed
  if (groom < 0.05) return;
  const alpha = 0.23 * groom * (1 - sstep(CORD_FAR * 0.5, CORD_FAR, dN));
  if (alpha < 0.012) return;

  const cN = centerAt(zN), cF = centerAt(zF);
  const pF = paramsAt(zF), hwF = pF.width;

  // three height samples per end is plenty — a groomed surface is smooth, and
  // this keeps the whole pass at ~6 terrainH calls per slab
  const yNC = terrainH(cN, zN), yNL = terrainH(cN - hwN, zN), yNR = terrainH(cN + hwN, zN);
  const yFC = terrainH(cF, zF), yFL = terrainH(cF - hwF, zF), yFR = terrainH(cF + hwF, zF);

  const want = clamp(dN * 8 / focal, CORD_BASE, 4);
  const step = Math.max(1, Math.pow(2, Math.round(Math.log2(want / CORD_BASE))));
  const sp = CORD_BASE * step;

  // only the part of the piste actually on screen at this depth
  const halfVis = dN * camTanH + 3;
  const axis = cam.x + fwdX * dN;
  const lo = Math.max(-hwN, axis - halfVis - cN);
  const hi = Math.min(hwN, axis + halfVis - cN);
  if (hi - lo < sp) return;

  const i0 = Math.ceil(lo / sp), i1 = Math.floor(hi / sp);
  if (i1 - i0 > 220) return;                          // sanity guard

  ctx.beginPath();
  let drawn = 0;
  for (let i = i0; i <= i1; i++) {
    const o = i * sp;
    const tN = o / hwN, tF = o / hwF;
    const yN = tN < 0 ? yNC + (yNL - yNC) * -tN : yNC + (yNR - yNC) * tN;
    const yF = tF < 0 ? yFC + (yFL - yFC) * -tF : yFC + (yFR - yFC) * tF;
    const a = project(cF + o, yF + 0.02, zF); if (!a.ok) continue;
    const ax = a.x, ay = a.y;
    const b = project(cN + o, yN + 0.02, zN); if (!b.ok) continue;
    if ((ax < -40 && b.x < -40) || (ax > W + 40 && b.x > W + 40)) continue;
    ctx.moveTo(ax, ay); ctx.lineTo(b.x, b.y);
    drawn++;
  }
  if (!drawn) return;
  const fog = fogAt(dN);
  ctx.strokeStyle = 'rgba(126,156,199,' + (alpha * (1 - fog)).toFixed(3) + ')';
  ctx.lineWidth = Math.max(0.7, DPR * 0.9);
  ctx.stroke();
}

function drawTerrain(horizon) {
  // pitching the camera down widens the ground footprint the frustum covers
  const tanH = Math.tan((0.92 + cam.fovBoost) * 0.5) * (W / H)
             * (1.08 / Math.max(0.34, Math.cos(cam.pitch)));
  camTanH = tanH;
  const rowGap = (1 / NEAR_Z - 1 / FAR_Z) / ROWS;   // d^2 * rowGap = row spacing
  // sample the grid
  for (let r = 0; r <= ROWS; r++) {
    const d = rowDepth(r / ROWS);
    const cxr = cam.x + fwdX * d, czr = cam.z + fwdZ * d;
    const halfW = Math.max(9, d * tanH + 7);
    const base = r * (COLS + 1);
    for (let c = 0; c <= COLS; c++) {
      const u = (c / COLS * 2 - 1) * halfW;
      const x = cxr + rgtX * u, z = czr + rgtZ * u;
      const y = terrainH(x, z);
      const i = base + c;
      gwx[i] = x; gwy[i] = y; gwz[i] = z;
      const pr = project(x, y, z);
      gok[i] = pr.ok ? 1 : 0;
      gxA[i] = pr.x; gyA[i] = pr.y; gdp[i] = pr.d;
      if (pr.ok) {
        // Sample the normal over roughly one grid cell. Too small and distant
        // rows alias the mogul field into shimmering noise; this low-passes it
        // so detail fades out cleanly with distance instead.
        const eps = clamp(d * d * rowGap * 0.8, 0.3, 9);
        const hx = terrainH(x + eps, z) - y, hz = terrainH(x, z + eps) - y;
        let nx = -hx / eps, ny = 1, nz = -hz / eps;
        const il = 1 / Math.hypot(nx, ny, nz);
        nx *= il; ny *= il; nz *= il;
        const p = paramsAt(z);
        const onP = 1 - sstep(p.width * 0.9, p.width * 1.1, Math.abs(x - centerAt(z)));
        // a mogul field is, by definition, not groomed
        gsh[i] = shadeSnow(x, z, nx, ny, nz, onP, d, clamp(1 - p.mogul * 2.2, 0, 1));
      }
    }
  }

  // paint far -> near, interleaving world objects & particles by depth
  const rl = renderList;
  let rp = 0;
  // anything past the far edge of the grid goes down first
  while (rp < rl.length && rl[rp].cd > FAR_Z) drawItem(rl[rp++]);

  // corduroy slabs, far -> near, drawn as their depth comes up in the row walk
  let cordK = ROWS >= 22 ? CORD_SLABS - 1 : -1;

  for (let r = ROWS - 1; r >= 0; r--) {
    const dNear = rowDepth(r / ROWS);
    const dMid = rowDepth((r + 0.5) / ROWS);
    const b0 = r * (COLS + 1), b1 = (r + 1) * (COLS + 1);
    const fog = clamp(Math.pow(dMid / FAR_Z, 1.42) * 1.18, 0, 1);
    const seam = dMid < 40;

    for (let c = 0; c < COLS; c++) {
